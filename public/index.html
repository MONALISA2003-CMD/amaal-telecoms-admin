<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Amaal Telecoms Admin</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#111827;--danger:#b91c1c;--ok:#047857}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:flex}.side{width:270px;background:#0b1220;color:#fff;padding:20px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{font-size:20px;font-weight:900;margin-bottom:22px}.section{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin:20px 8px 7px}.nav{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:10px 12px;border-radius:10px;margin:2px 0}.nav:hover,.nav.active{background:#172033;color:#fff}.main{margin-left:270px;width:calc(100% - 270px);padding:28px;max-width:1600px}.mobilebar{display:none}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.title{font-size:30px;font-weight:900;margin:0}.sub{color:var(--muted);margin:5px 0 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-top:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.metric{font-size:30px;font-weight:900;margin-top:8px}.label{font-size:13px;color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:700}.btn.primary{background:#111827;color:#fff;border-color:#111827}.btn.danger{color:#fff;background:#b91c1c;border-color:#b91c1c}.btn:disabled{opacity:.5;cursor:not-allowed}.tablewrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}.table th{background:#f8fafc;color:#475569;font-size:12px}.muted{color:var(--muted)}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:11px;font-weight:800}.ok{color:var(--ok)}.bad{color:var(--danger)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#94a3b8;box-shadow:0 0 0 3px #e2e8f0}.span2{grid-column:1/-1}.notice{padding:12px 14px;border-radius:10px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;margin-top:15px}.success{padding:12px 14px;border-radius:10px;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;margin-top:15px}.error{padding:12px 14px;border-radius:10px;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;margin-top:15px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modalbox{background:#fff;border-radius:18px;padding:22px;width:min(600px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.empty{padding:40px;text-align:center;color:var(--muted)}.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#0b1220}.authbox{width:min(460px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 25px 70px #0005}.auth h1{margin:0;font-size:25px}.auth p{color:var(--muted)}.auth .field{margin:14px 0}.userbox{border-top:1px solid #243044;margin-top:18px;padding-top:14px;color:#94a3b8;font-size:12px}.spinner{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:900px){.side{display:none}.main{margin:0;width:100%;padding:16px}.mobilebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.top{display:block}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px}.metric{font-size:24px}.title{font-size:24px}}
</style></head><body><div id="app"></div>
<script>
const state={user:null,permissions:new Set(),view:'Dashboard',data:null,error:'',message:'',loading:false};
const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cookie(name){return document.cookie.split(';').map(x=>x.trim()).find(x=>x.startsWith(name+'='))?.slice(name.length+1)||''}async function api(path,opt={}){const headers={'Content-Type':'application/json',...(opt.headers||{})};const csrf=cookie('amaal_csrf');if(csrf)headers['X-CSRF-Token']=csrf;const r=await fetch('/api'+path,{...opt,headers,credentials:'same-origin'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d}
function has(p){return state.permissions.has(p)}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label>${esc(label)}</label><input name="${esc(name)}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function select(label,name,value,opts){return `<div class="field"><label>${esc(label)}</label><select name="${esc(name)}">${opts.map(o=>`<option value="${esc(o[0])}" ${String(value)===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`}
function btn(text,action,cls='btn'){return `<button class="${cls}" data-action="${action}">${esc(text)}</button>`}
async function boot(){try{const h=await api('/health');if(!h.ok)throw Error('Database unavailable');try{const m=await api('/me');state.user=m.user;state.permissions=new Set(m.permissions);render();await load(state.view)}catch{}if(!state.user){const s=await api('/setup/status');renderAuth(!!s.configured)}}catch(e){$('#app').innerHTML=`<div class="auth"><div class="authbox"><h1>Amaal Telecoms</h1><p>Unable to connect to the administration service.</p><div class="error">${esc(e.message)}</div></div></div>`}}
function renderAuth(configured){$('#app').innerHTML=`<div class="auth"><form class="authbox" id="authform"><h1>Amaal Telecoms</h1><p>${configured?'Secure administrator sign in.':'Create the first administrator for this organization.'}</p>${!configured?field('Company name','companyName','Amaal Telecoms'):''}${field('Administrator email','email','', 'email','required')}${field(configured?'Password':'Password (minimum 12 characters)','password','', 'password','required minlength="12"')}${!configured?field('Phone','phone'):''}${!configured?field('Address','address'):''}${configured?field('Authenticator code (if MFA is enabled)','code','','text','inputmode="numeric" autocomplete="one-time-code"'):''}<div id="authmsg"></div><button class="btn primary" style="width:100%;margin-top:8px">${configured?'Sign in':'Create administrator'}</button></form></div>`;$('#authform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const body=Object.fromEntries(f.entries());try{const d=await api(configured?'/login':'/setup',{method:'POST',body:JSON.stringify(body)});state.user=d.user;const m=await api('/me');state.user=m.user;state.permissions=new Set(m.permissions);render();await load('Dashboard')}catch(x){$('#authmsg').innerHTML=`<div class="error">${esc(x.message)}</div>`}}}
const navGroups=[['Overview',['Dashboard']],['Identity & access',['Staff','Roles','Invitations','Sessions','Security']],['Organization',['Organization','Departments']],['Governance',['Audit','Notifications','Settings']]];
function render(){const nav=navGroups.map(([g,items])=>`<div class="section">${g}</div>`+items.map(v=>`<button class="nav ${state.view===v?'active':''}" data-nav="${v}">${v}</button>`).join('')).join('');$('#app').innerHTML=`<div class="layout"><aside class="side"><div class="brand">Amaal Telecoms</div>${nav}<div class="userbox">${esc(state.user?.email||'')}<br><button class="nav" data-action="logout" style="padding-left:0;margin-top:8px">Sign out</button></div></aside><main class="main"><div class="mobilebar"><b>Amaal Telecoms</b><button class="btn" data-action="logout">Sign out</button></div><div class="top"><div><h1 class="title">${esc(state.view)}</h1><p class="sub">International administration foundation · live database · no mock records</p></div><div>${state.loading?'Loading…':''}</div></div><div id="flash"></div><div id="content" class="spinner">Loading…</div></main></div>`;document.querySelectorAll('[data-nav]').forEach(x=>x.onclick=async()=>{state.view=x.dataset.nav;render();await load(state.view)});document.querySelectorAll('[data-action="logout"]').forEach(x=>x.onclick=logout);}
function flash(){const f=$('#flash');if(!f)return;f.innerHTML=state.error?`<div class="error">${esc(state.error)}</div>`:state.message?`<div class="success">${esc(state.message)}</div>`:'';state.error='';state.message=''}
async function load(v){state.loading=true;try{const map={Dashboard:'/dashboard',Staff:'/staff',Roles:'/roles',Invitations:'/invitations',Sessions:'/sessions/all',Security:'/security/policy',Organization:'/organization',Departments:'/departments',Branches:'/branches',Audit:'/audit',Notifications:'/notifications',Settings:'/settings'};state.data=await api(map[v]);renderView()}catch(e){state.error=e.message;renderView()}finally{state.loading=false;flash()}}
function renderView(){const c=$('#content');if(!c)return;const d=state.data;if(state.view==='Dashboard')c.innerHTML=dashboard(d);if(state.view==='Staff')c.innerHTML=staff(d);if(state.view==='Roles')c.innerHTML=roles(d);if(state.view==='Sessions')c.innerHTML=sessions(d);if(state.view==='Security')c.innerHTML=security(d);if(state.view==='Organization')c.innerHTML=organization(d);if(state.view==='Departments')c.innerHTML=departments(d);if(state.view==='Audit')c.innerHTML=audit(d);if(state.view==='Notifications')c.innerHTML=notifications(d);if(state.view==='Settings')c.innerHTML=settings(d);bindView();flash()}
function dashboard(d){return `<div class="grid">${[['Staff',d?.users],['Audit events',d?.auditEvents],['Unread notifications',d?.unreadNotifications],['Security events','Live']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="metric">${x[1]??0}</div></div>`).join('')}</div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="card"><b>Administration foundation</b><p class="muted">Identity, organization, RBAC, security policy, sessions, governance and audit controls are now available as real database-backed modules.</p></div><div class="card"><b>Security posture</b><p class="muted">MFA, password policy, session controls and login-event monitoring are available under Security.</p></div></div>`}
function table(headers,rows,empty='No records yet.'){return `<div class="tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}"><div class="empty">${empty}</div></td></tr>`}</tbody></table></div>`}
function staff(d){return `<div class="toolbar">${has('staff.manage')?btn('Add staff','add-staff','btn primary'):''}</div>`+table(['Staff','Status','Roles','Branches','Last login','Actions'],(d||[]).map(r=>`<tr><td><b>${esc(r.name)}</b><br><span class="muted">${esc(r.email)}</span></td><td>${esc(r.status)}</td><td>${esc((r.roles||[]).join(', '))}</td><td>${esc((r.branches||[]).join(', '))}</td><td>${r.last_login_at?esc(new Date(r.last_login_at).toLocaleString()):'Never'}</td><td>${has('staff.profile.manage')?btn('Profile','profile:'+r.id):''} ${has('sessions.manage')?btn('Revoke sessions','revoke:'+r.id,'btn danger'):''}</td></tr>`))}
function roles(d){return `<div class="toolbar">${has('roles.manage')?btn('Create role','add-role','btn primary'):''}</div>`+table(['Role','Description','System','Permissions'],(d||[]).map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.description)}</td><td>${r.system?'System':'Custom'}</td><td>${esc((r.permissions||[]).join(', '))}</td></tr>`))}
function sessions(d){return table(['User','Created','Last seen','Expires','IP','Device','Action'],(d||[]).filter(r=>!r.revoked_at).map(r=>`<tr><td><b>${esc(r.name)}</b><br>${esc(r.email)}</td><td>${new Date(r.created_at).toLocaleString()}</td><td>${new Date(r.last_seen_at).toLocaleString()}</td><td>${new Date(r.expires_at).toLocaleString()}</td><td>${esc(r.ip||'')}</td><td>${esc(r.user_agent||'').slice(0,100)}</td><td>${has('sessions.manage')?btn('Revoke','revoke-session:'+r.id,'btn danger'):''}</td></tr>`))}
function security(d){return `<div class="card"><h2>Security policy</h2><p class="muted">Controls are stored in PostgreSQL and applied by the authentication layer.</p><form id="securityForm" class="formgrid">${field('Maximum login attempts','maxLoginAttempts',d.maxLoginAttempts,'number')}${field('Lockout minutes','lockoutMinutes',d.lockoutMinutes,'number')}${field('Session minutes','sessionMinutes',d.sessionMinutes,'number')}${field('Password minimum length','passwordMinLength',d.passwordMinLength,'number')}${field('Idle timeout minutes','idleTimeoutMinutes',d.idleTimeoutMinutes,'number')}${field('Audit retention days','auditRetentionDays',d.auditRetentionDays,'number')}<div class="field"><label>MFA required</label><select name="mfaRequired"><option value="true" ${d.mfaRequired?'selected':''}>Required</option><option value="false" ${!d.mfaRequired?'selected':''}>Optional</option></select></div><div class="field"><label>Password requires uppercase</label><select name="passwordRequireUpper"><option value="true" ${d.passwordRequireUpper?'selected':''}>Yes</option><option value="false" ${!d.passwordRequireUpper?'selected':''}>No</option></select></div><div class="field"><label>Password requires number</label><select name="passwordRequireNumber"><option value="true" ${d.passwordRequireNumber?'selected':''}>Yes</option><option value="false" ${!d.passwordRequireNumber?'selected':''}>No</option></select></div><div class="field"><label>Password requires symbol</label><select name="passwordRequireSymbol"><option value="true" ${d.passwordRequireSymbol?'selected':''}>Yes</option><option value="false" ${!d.passwordRequireSymbol?'selected':''}>No</option></select></div><div class="span2">${btn('Save security policy','save-security','btn primary')} ${btn('Set up my MFA','setup-mfa')} ${btn('Change my password','change-password')}</div></form></div><div class="card" style="margin-top:16px"><h2>Security posture</h2><div id="securitySummary" class="grid" style="margin-top:12px"></div></div><div class="card" style="margin-top:16px"><h2>Recent login events</h2><div id="securityEvents">Loading…</div></div>`}
function organization(d){return `<form id="orgForm" class="card formgrid">${field('Legal name','legal_name',d?.legal_name)}${field('Trading name','trading_name',d?.trading_name)}${field('Registration number','registration_number',d?.registration_number)}${field('Tax number','tax_number',d?.tax_number)}${field('Country code','country_code',d?.country_code||'UG')}${field('Currency','currency',d?.currency||'UGX')}${field('Timezone','timezone',d?.timezone||'Africa/Kampala')}${field('Locale','locale',d?.locale||'en-UG')}${field('City','city',d?.city)}${field('Region / State','region',d?.region)}${field('Postal code','postal_code',d?.postal_code)}${field('Phone','phone',d?.phone)}${field('Email','email',d?.email,'email')}${field('Website','website',d?.website,'url')}${`<div class="field span2"><label>Address</label><textarea name="address">${esc(d?.address||'')}</textarea></div>`}<div class="span2">${has('organization.manage')?btn('Save organization','save-org','btn primary'):''}</div></form>`}
function departments(d){return `<div class="toolbar">${has('departments.manage')?btn('Add department','add-dept','btn primary'):''}</div>`+table(['Department','Code','Manager','Users','Status'],(d||[]).map(r=>`<tr><td><b>${esc(r.name)}</b><br><span class="muted">${esc(r.description)}</span></td><td>${esc(r.code)}</td><td>${esc(r.manager_name||'Unassigned')}</td><td>${r.user_count}</td><td>${esc(r.status)}</td></tr>`))}
function branches(d){return `<div class="toolbar">${has('branches.manage')?btn('Add branch','add-branch','btn primary'):''}</div>`+table(['Branch','Address','Status','Created'],(d||[]).map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.address)}</td><td>${esc(r.status)}</td><td>${new Date(r.created_at).toLocaleDateString()}</td></tr>`))}
function audit(d){return `<div class="toolbar">${btn('Refresh','refresh')}${has('audit.export')?btn('Export CSV','export-audit'):''}</div>`+table(['Time','Action','Resource','Actor','IP','Detail'],(d||[]).map(r=>`<tr><td>${new Date(r.created_at).toLocaleString()}</td><td><b>${esc(r.action)}</b></td><td>${esc(r.resource_type)} ${esc(r.resource_id||'')}</td><td>${esc(r.actor_email||'System')}</td><td>${esc(r.ip||'')}</td><td>${esc(r.detail)}</td></tr>`))}
function notifications(d){return `<div class="toolbar">${has('notifications.manage')?btn('Create notification','add-notification','btn primary'):''}</div>`+table(['Title','Message','Status','Created'],(d||[]).map(r=>`<tr><td><b>${esc(r.title)}</b></td><td>${esc(r.body)}</td><td>${r.read_at?'Read':'Unread'}</td><td>${new Date(r.created_at).toLocaleString()}</td></tr>`))}
function invitations(d){return `<div class="toolbar">${has('staff.manage')?btn('Create invitation','add-invite','btn primary'):''}</div>`+table(['Email','Name','Role','Expires','Status','Created'],(d||[]).map(r=>`<tr><td>${esc(r.email)}</td><td>${esc(r.name||'')}</td><td>${esc(r.role_name||'')}</td><td>${new Date(r.expires_at).toLocaleString()}</td><td>${r.accepted_at?'Accepted':r.revoked_at?'Revoked':new Date(r.expires_at)<new Date()?'Expired':'Pending'}</td><td>${new Date(r.created_at).toLocaleString()}</td></tr>`))}function settings(d){return `<div class="card"><h2>System settings</h2><p class="muted">Use Security and Organization for structured configuration. These legacy platform settings remain available here.</p><form id="settingsForm" class="formgrid">${field('Company name','companyName',d.companyName||'')}${field('Company email','companyEmail',d.companyEmail||'','email')}${field('Company phone','companyPhone',d.companyPhone||'')}${field('Company address','companyAddress',d.companyAddress||'')}${field('Currency','currency',d.currency||'')}${field('Timezone','timezone',d.timezone||'')}${field('Session minutes','sessionMinutes',d.sessionMinutes||720,'number')}<div class="span2">${has('settings.manage')?btn('Save settings','save-settings','btn primary'):''}</div></form></div>`}
function modal(title,html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><div class="modalhead"><h2 style="margin:0">${esc(title)}</h2><button class="btn" data-close>Close</button></div>${html}</div>`;document.body.appendChild(m);m.querySelector('[data-close]').onclick=()=>m.remove();return m}
function formModal(title,fields,onSubmit){const m=modal(title,`<form id="modalForm" class="formgrid">${fields.join('')}<div class="span2"><button class="btn primary">Save</button></div><div id="modalMsg" class="span2"></div></form>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target).entries());try{await onSubmit(body);m.remove();state.message='Saved successfully';await load(state.view)}catch(x){m.querySelector('#modalMsg').innerHTML=`<div class="error">${esc(x.message)}</div>`}}}
async function bindView(){document.querySelectorAll('[data-action]').forEach(b=>{b.onclick=async()=>{const a=b.dataset.action;try{if(a==='refresh')return load(state.view);if(a==='export-audit'){window.location.href='/api/audit/export';return}if(a==='add-invite')return formModal('Create staff invitation',[field('Email','email','','email','required'),field('Name','name'),field('Role ID','roleId')],async x=>{const d=await api('/invitations',{method:'POST',body:JSON.stringify(x)});alert('Invitation created. Secure token:\n\n'+d.inviteToken);});
if(a==='change-password')return formModal('Change password',[field('Current password','currentPassword','','password','required'),field('New password','newPassword','','password','required minlength="12"')],async x=>api('/security/password/change',{method:'POST',body:JSON.stringify(x)}));
if(a==='add-staff')return formModal('Create staff',[field('Name','name'),field('Email','email','','email'),field('Temporary password','password','','password','minlength="12"'),field('Phone','phone'),field('Job title','jobTitle')],async x=>api('/users',{method:'POST',body:JSON.stringify(x)}));if(a.startsWith('edit-role:')){const id=a.split(':')[1];const role=(state.data||[]).find(x=>x.id===id);const perms=await api('/permissions');return formModal('Edit role',[field('Name','name',role.name),field('Description','description',role.description),`<div class="field span2"><label>Permissions</label><textarea name="permissions" style="min-height:180px">${esc((role.permissions||[]).join('\n'))}</textarea><small class="muted">One permission ID per line. Available: ${(perms||[]).map(x=>x.id).join(', ')}</small></div>`],async x=>api('/roles/'+id,{method:'PATCH',body:JSON.stringify({...x,permissions:x.permissions.split(/\n|,/).map(v=>v.trim()).filter(Boolean)})}));}if(a==='add-role')return formModal('Create role',[field('Name','name'),field('Description','description')],async x=>api('/roles',{method:'POST',body:JSON.stringify({...x,permissions:[]})}));if(a==='add-branch')return formModal('Create branch',[field('Name','name'),field('Address','address')],async x=>api('/branches',{method:'POST',body:JSON.stringify(x)}));if(a==='add-dept')return formModal('Create department',[field('Name','name'),field('Code','code'),field('Description','description')],async x=>api('/departments',{method:'POST',body:JSON.stringify(x)}));if(a==='add-notification')return formModal('Create notification',[field('Title','title'),`<div class="field span2"><label>Message</label><textarea name="body"></textarea></div>`],async x=>api('/notifications',{method:'POST',body:JSON.stringify(x)}));if(a.startsWith('revoke:')){if(!confirm('Revoke all active sessions for this user?'))return;await api('/sessions/user/'+a.split(':')[1],{method:'DELETE'});return load('Sessions')}if(a.startsWith('revoke-session:')){await 'name'),field('Phone','phone'),field('Employee ID','employeeId'),field('Job title','jobTitle'),field('Department ID','departmentId'),field('Country code','countryCode','UG'),field('Locale','locale','en-UG'),field('Timezone','timezone','Africa/Kampala')],async x=>api('/users/'+id+'/profile',{method:'PATCH',body:JSON.stringify(x)}))}}catch(e){state.error=e.message;flash()}}});if(state.view==='Security'){try{const sm=await api('/security/summary');$('#securitySummary').innerHTML=[['Failed logins (24h)',sm.failedLogins24h],['Active sessions',sm.activeSessions],['Locked accounts',sm.lockedAccounts],['MFA users',sm.mfaUsers]].map(x=>`<div class="card"><div class="label">${esc(x[0])}</div><div class="metric">${x[1]}</div></div>`).join('');const ev=await api('/security/events?limit=50');$('#securityEvents').innerHTML=table(['Time','User','Result','Reason','IP'],ev.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString()}</td><td>${esc(r.user_name||r.email)}</td><td class="${r.success?'ok':'bad'}">${r.success?'Success':'Failed'}</td><td>${esc(r.reason)}</td><td>${esc(r.ip||'')}</td></tr>`))}catch(e){$('#securityEvents').innerHTML=`<div class="error">${esc(e.message)}</div>`}}}
