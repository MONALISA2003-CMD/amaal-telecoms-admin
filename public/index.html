<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amaal Telecoms Admin</title><script src="https://cdn.tailwindcss.com"></script><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><style>body{font-family:Inter,system-ui;background:#f8fafc;color:#0f172a}button:disabled{opacity:.5}</style></head><body><div id="root"></div><script>
const {useState,useEffect}=React; const api=async(p,o={})=>{const token=localStorage.getItem('amaal_token');const r=await fetch('/api'+p,{...o,headers:{'Content-Type':'application/json',...(o.headers||{}),...(token?{Authorization:'Bearer '+token}:{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d};
function Field({label,...p}){return <label className="block"><span className="text-xs font-semibold text-slate-600">{label}</span><input {...p} className="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 outline-none focus:ring-2 focus:ring-slate-200"/></label>};
function Button({children,...p}){return <button {...p} className={'rounded-xl px-4 py-2.5 text-sm font-semibold '+(p.className||'bg-slate-900 text-white')}>{children}</button>};
function Auth({setup,onDone}){const [f,setF]=useState({companyName:'Amaal Telecoms',email:'',password:'',phone:'',address:''}),[err,setErr]=useState(''),[busy,setBusy]=useState(false);const submit=async e=>{e.preventDefault();setBusy(true);try{const d=await api(setup?'/setup':'/login',{method:'POST',body:JSON.stringify(setup?f:{email:f.email,password:f.password})});localStorage.setItem('amaal_token',d.token);onDone()}catch(e){setErr(e.message)}finally{setBusy(false)}};return <div className="min-h-screen bg-slate-950 flex items-center justify-center p-5"><form onSubmit={submit} className="bg-white rounded-3xl p-7 w-full max-w-md space-y-4 shadow-2xl"><div><div className="text-2xl font-black">Amaal Telecoms</div><div className="text-sm text-slate-500 mt-1">{setup?'Create the first real administrator.':'Secure administrator sign in.'}</div></div>{setup&&<Field label="Company name" value={f.companyName} onChange={e=>setF({...f,companyName:e.target.value})}/>}<Field label="Administrator email" type="email" required value={f.email} onChange={e=>setF({...f,email:e.target.value})}/><Field label="Password" type="password" required value={f.password} onChange={e=>setF({...f,password:e.target.value})}/>{setup&&<><Field label="Phone" value={f.phone} onChange={e=>setF({...f,phone:e.target.value})}/><Field label="Address" value={f.address} onChange={e=>setF({...f,address:e.target.value})}/></>}{err&&<div className="text-sm text-red-600">{err}</div>}<Button disabled={busy} className="w-full bg-slate-900 text-white">{busy?'Please wait…':setup?'Create administrator':'Sign in'}</Button></form></div>}
function App(){const [ready,setReady]=useState(false),[me,setMe]=useState(null),[setup,setSetup]=useState(false),[view,setView]=useState('Dashboard'),[data,setData]=useState(null),[err,setErr]=useState('');useEffect(()=>{(async()=>{try{const h=await api('/health');if(h.ok){try{const m=await api('/me');setMe(m)}catch{const s=await fetch('/api/setup',{method:'HEAD'});setSetup(false)}}}catch(e){setErr('Backend/database unavailable. '+e.message)}finally{setReady(true)}})()},[]);useEffect(()=>{if(me)load(view)},[me,view]);async function load(v){try{setErr('');if(v==='Dashboard')setData(await api('/dashboard'));if(v==='Staff')setData(await api('/staff'));if(v==='Roles')setData(await api('/roles'));if(v==='Branches')setData(await api('/branches'));if(v==='Audit')setData(await api('/audit'));if(v==='Notifications')setData(await api('/notifications'));if(v==='Settings')setData(await api('/settings'))}catch(e){setErr(e.message)}}async function logout(){await api('/logout',{method:'POST'}).catch(()=>{});localStorage.removeItem('amaal_token');setMe(null)}if(!ready)return <div className="p-8">Connecting…</div>;if(!me)return <Auth setup={setup} onDone={async()=>{try{setMe(await api('/me'))}catch{location.reload()}}}/>;return <div className="min-h-screen flex"><aside className="w-64 bg-slate-950 text-white p-5 hidden md:block"><div className="font-black text-xl mb-8">Amaal Telecoms</div>{['Dashboard','Staff','Roles','Branches','Audit','Notifications','Settings'].map(x=><button onClick={()=>setView(x)} className={'w-full text-left px-3 py-2.5 rounded-xl mb-1 '+(view===x?'bg-white/10':'hover:bg-white/5')}>{x}</button>)}<div className="mt-8 text-xs text-slate-400">{me.user?.email}</div><button onClick={logout} className="mt-3 text-sm text-red-300">Sign out</button></aside><main className="flex-1 p-5 md:p-8"><div className="md:hidden flex justify-between mb-5"><b>Amaal Telecoms</b><button onClick={logout}>Sign out</button></div><h1 className="text-3xl font-black">{view}</h1><p className="text-slate-500 mt-1">Cloud-backed administrative foundation. No demo business records.</p>{err&&<div className="mt-4 p-3 rounded-xl bg-red-50 text-red-700">{err}</div>}<div className="mt-7">{view==='Dashboard'&&<Dashboard d={data}/>} {view==='Staff'&&<Staff d={data} reload={()=>load('Staff')}/>} {view==='Roles'&&<Simple title="Roles" rows={data}/>} {view==='Branches'&&<Branches d={data} reload={()=>load('Branches')}/>} {view==='Audit'&&<Audit d={data}/>} {view==='Notifications'&&<Simple title="Notifications" rows={data}/>} {view==='Settings'&&<Settings d={data} reload={()=>load('Settings')}/>}</div></main></div>}
function Dashboard({d}){if(!d)return <div>Loading…</div>;return <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">{[['Staff',d.users],['Active branches',d.activeBranches],['Audit events',d.auditEvents],['Unread notifications',d.unreadNotifications]].map(x=><div className="bg-white border rounded-2xl p-5"><div className="text-sm text-slate-500">{x[0]}</div><div className="text-3xl font-black mt-2">{x[1]}</div></div>)}</div>}
function Simple({title,rows}){return <div className="bg-white border rounded-2xl overflow-auto"><table className="w-full text-sm"><thead><tr className="bg-slate-50 text-left"><th className="p-4">Name</th><th className="p-4">Details</th></tr></thead><tbody>{(rows||[]).map(r=><tr className="border-t"><td className="p-4 font-semibold">{r.name||r.title||r.action||'Notification'}</td><td className="p-4 text-slate-500">{r.description||r.body||r.detail||''}</td></tr>)}</tbody></table>{!rows?.length&&<div className="p-8 text-center text-slate-500">No records yet.</div>}</div>}
function Staff({d,reload}){const [open,setOpen]=useState(false),[f,setF]=useState({name:'',email:'',password:''}),[err,setErr]=useState('');async function add(e){e.preventDefault();try{await api('/users',{method:'POST',body:JSON.stringify(f)});setOpen(false);setF({name:'',email:'',password:''});reload()}catch(e){setErr(e.message)}}return <><div className="flex justify-end mb-4"><Button onClick={()=>setOpen(true)}>Add staff</Button></div><Simple rows={d}/>{open&&<div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4"><form onSubmit={add} className="bg-white rounded-2xl p-6 w-full max-w-md space-y-4"><h2 className="font-bold text-xl">Create staff</h2><Field label="Name" required value={f.name} onChange={e=>setF({...f,name:e.target.value})}/><Field label="Email" type="email" required value={f.email} onChange={e=>setF({...f,email:e.target.value})}/><Field label="Temporary password" type="password" required value={f.password} onChange={e=>setF({...f,password:e.target.value})}/>{err&&<p className="text-red-600 text-sm">{err}</p>}<div className="flex gap-2"><Button type="button" className="bg-white border" onClick={()=>setOpen(false)}>Cancel</Button><Button type="submit">Create</Button></div></form></div>}</>}
function Branches({d,reload}){const [f,setF]=useState({name:'',address:''}),[err,setErr]=useState('');async function add(e){e.preventDefault();try{await api('/branches',{method:'POST',body:JSON.stringify(f)});setF({name:'',address:''});reload()}catch(e){setErr(e.message)}}return <><form onSubmit={add} className="bg-white border rounded-2xl p-5 grid md:grid-cols-3 gap-3 mb-5"><Field label="Branch name" required value={f.name} onChange={e=>setF({...f,name:e.target.value})}/><Field label="Address" value={f.address} onChange={e=>setF({...f,address:e.target.value})}/><div className="flex items-end"><Button type="submit">Add branch</Button></div>{err&&<div className="text-red-600 text-sm">{err}</div>}</form><Simple rows={d}/></>}
function Audit({d}){return <div className="bg-white border rounded-2xl overflow-auto"><table className="w-full text-sm"><thead><tr className="bg-slate-50 text-left"><th className="p-4">Time</th><th className="p-4">Action</th><th className="p-4">Actor</th><th className="p-4">Detail</th></tr></thead><tbody>{(d||[]).map(r=><tr className="border-t"><td className="p-4 whitespace-nowrap">{new Date(r.created_at).toLocaleString()}</td><td className="p-4 font-semibold">{r.action}</td><td className="p-4">{r.actor_email||'System'}</td><td className="p-4">{r.detail}</td></tr>)}</tbody></table></div>}
function Settings({d,reload}){const [f,setF]=useState(d||{}),[msg,setMsg]=useState('');useEffect(()=>setF(d||{}),[d]);async function save(e){e.preventDefault();try{await api('/settings',{method:'PUT',body:JSON.stringify(f)});setMsg('Saved');reload()}catch(e){setMsg(e.message)}}return <form onSubmit={save} className="bg-white border rounded-2xl p-5 max-w-3xl grid md:grid-cols-2 gap-4"><Field label="Company name" value={f.companyName||''} onChange={e=>setF({...f,companyName:e.target.value})}/><Field label="Company email" value={f.companyEmail||''} onChange={e=>setF({...f,companyEmail:e.target.value})}/><Field label="Phone" value={f.companyPhone||''} onChange={e=>setF({...f,companyPhone:e.target.value})}/><Field label="Address" value={f.companyAddress||''} onChange={e=>setF({...f,companyAddress:e.target.value})}/><Field label="Currency" value={f.currency||''} onChange={e=>setF({...f,currency:e.target.value})}/><Field label="Timezone" value={f.timezone||''} onChange={e=>setF({...f,timezone:e.target.value})}/><Field label="Session minutes" type="number" value={f.sessionMinutes||60} onChange={e=>setF({...f,sessionMinutes:Number(e.target.value)})}/><div className="md:col-span-2 flex items-center gap-3"><Button type="submit">Save settings</Button>{msg&&<span className="text-sm text-slate-500">{msg}</span>}</div></form>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
