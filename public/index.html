<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="theme-color" content="#0f172a"><title>Amaal Telecoms | Administration</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#0f172a;--brand2:#1e293b;--danger:#b91c1c;--ok:#047857;--warn:#a16207;--shadow:0 10px 30px rgba(15,23,42,.06)}*{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh}.side{width:260px;background:var(--brand);color:#fff;padding:18px 14px;position:fixed;inset:0 auto 0 0;overflow:auto;z-index:30}.brand{padding:8px 10px 18px;font-size:20px;font-weight:900}.brand small{display:block;color:#94a3b8;font-size:11px;font-weight:600;margin-top:3px}.section{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.1em;margin:17px 9px 6px}.nav{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:9px 11px;border-radius:9px;margin:2px 0;font-weight:650}.nav:hover,.nav.active{background:#1e293b;color:#fff}.userbox{border-top:1px solid #243044;margin-top:18px;padding:14px 10px;color:#94a3b8;font-size:12px}.main{margin-left:260px;width:calc(100% - 260px);padding:24px;max-width:1700px}.mobilebar{display:none}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.title{font-size:30px;line-height:1.1;font-weight:900;margin:0}.sub{color:var(--muted);margin:7px 0 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:16px 0}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.metric{font-size:29px;font-weight:900;margin-top:7px}.label{font-size:12px;color:var(--muted);font-weight:650}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:9px;font-weight:750}.btn:hover{border-color:#94a3b8}.btn.primary{background:#111827;color:#fff;border-color:#111827}.btn.danger{color:#fff;background:#b91c1c;border-color:#b91c1c}.btn.ghost{background:#f8fafc}.btn:disabled{opacity:.5;cursor:not-allowed}.tablewrap{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:auto;box-shadow:var(--shadow)}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}.table th{background:#f8fafc;color:#475569;font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}.table tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:800}.pill.ok{background:#ecfdf5;color:#047857}.pill.warn{background:#fffbeb;color:#a16207}.pill.bad{background:#fef2f2;color:#b91c1c}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field label{display:block;font-size:11px;font-weight:800;color:#475569;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}.field textarea{min-height:95px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#64748b;box-shadow:0 0 0 3px #e2e8f022}.span2{grid-column:1/-1}.notice,.success,.error{padding:11px 13px;border-radius:10px;margin:12px 0;font-size:13px}.notice{background:#fffbeb;color:#92400e;border:1px solid #fde68a}.success{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.empty{padding:42px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.modal{position:fixed;inset:0;background:rgba(2,6,23,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}.modalbox{background:#fff;border-radius:17px;padding:20px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 90px rgba(0,0,0,.25)}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:17px}.modalhead h2{margin:0;font-size:20px}.close{border:0;background:#f1f5f9;border-radius:8px;width:34px;height:34px;font-size:20px}.spinner{padding:50px;text-align:center;color:var(--muted)}.search{display:flex;gap:8px;max-width:620px}.search input{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 11px;min-width:0}.search-row{cursor:pointer}.search-row:hover,.search-row:focus{background:#f8fafc;outline:none}.search-row:focus td:first-child{box-shadow:inset 3px 0 0 #111827}kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:#e2e8f0;color:#334155;border-radius:5px;padding:2px 5px}.statline{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid var(--line)}.statline:last-child{border-bottom:0}.list{display:grid;gap:9px}.listitem{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}.actions{display:flex;gap:6px;flex-wrap:wrap}.modulelinks{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.modulelinks .btn{font-size:12px}.hero{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;border-radius:17px;padding:22px}.hero .muted{color:#cbd5e1}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:#94a3b8}.sectiontitle{margin:0 0 4px;font-size:18px}.subsection{margin-top:22px}.checkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.check{border:1px solid var(--line);border-radius:9px;padding:8px}.check input{margin-right:7px}.mobileOnly{display:none}
@media(max-width:1000px){.side{display:none}.main{margin:0;width:100%;padding:15px}.mobilebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.mobileOnly{display:block}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.top{display:block}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:9px}.card{padding:13px}.metric{font-size:23px}.title{font-size:24px}.toolbar{gap:7px}.btn{padding:9px 10px}.search{max-width:none}.modal{padding:8px}.modalbox{padding:15px;border-radius:14px}.checkgrid{grid-template-columns:1fr}.table th,.table td{padding:10px}.hero{padding:17px}}
</style></head>
<body><div id="app"></div><script src="/app.js" defer></script></body></html>
