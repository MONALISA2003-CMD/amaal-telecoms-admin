<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amaal Telecoms — Admin</title>
<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],display:['Space Grotesk','sans-serif']}}}}</script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/lucide@latest"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>html,body,#root{height:100%;margin:0}body{font-family:Inter,sans-serif;background:#f8fafc;color:#0f172a}*{box-sizing:border-box}.scrollbar::-webkit-scrollbar{width:7px}.scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}</style>
</head><body><div id="root"></div><script type="text/babel">
const {useState,useEffect,useMemo}=React;
const DB_KEY='amaal_admin_phase1_foundation_v2';
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString();
const PERMISSIONS=[
 ['dashboard.view','View dashboard'],['staff.view','View staff'],['staff.manage','Manage staff'],['roles.view','View roles'],['roles.manage','Manage roles'],['branches.view','View branches'],['branches.manage','Manage branches'],['settings.view','View settings'],['settings.manage','Manage settings'],['audit.view','View audit logs'],['notifications.view','View notifications'],['notifications.manage','Manage notifications']
];
const DEFAULT_ROLES=[{id:'super-admin',name:'Super Admin',description:'Full administrative access.',system:true,permissions:PERMISSIONS.map(x=>x[0])},{id:'administrator',name:'Administrator',description:'Administrative operations.',system:true,permissions:['dashboard.view','staff.view','staff.manage','roles.view','branches.view','branches.manage','settings.view','audit.view','notifications.view','notifications.manage']},{id:'manager',name:'Manager',description:'Dashboard and operational visibility.',system:true,permissions:['dashboard.view','branches.view','notifications.view']}];
const emptyDB=()=>({version:2,setup:false,company:{name:'Amaal Telecoms',email:'',phone:'',address:''},users:[],roles:DEFAULT_ROLES,branches:[],notifications:[],audit:[],securityEvents:[],settings:{currency:'UGX',timezone:'Africa/Kampala',sessionMinutes:60,maxLoginAttempts:5,lockoutMinutes:15},session:null});
function load(){try{return JSON.parse(localStorage.getItem(DB_KEY))||null}catch{return null}}
function save(db){localStorage.setItem(DB_KEY,JSON.stringify(db))}
function normalize(db){const x={...emptyDB(),...db};x.roles=x.roles?.length?x.roles:DEFAULT_ROLES;x.users=x.users||[];x.branches=x.branches||[];x.notifications=x.notifications||[];x.audit=x.audit||[];x.securityEvents=x.securityEvents||[];x.settings={...emptyDB().settings,...(x.settings||{})};return x}
function audit(db,action,resource,detail,user,before=null,after=null){db.audit=[{id:uid(),at:now(),action,resource,resourceId:null,detail,userId:user?.id||null,user:user?.email||'System',before,after,branchId:user?.branchId||null,requestId:uid()},...(db.audit||[])].slice(0,1000);return db}
async function hashPassword(password,salt){const enc=new TextEncoder();const data=enc.encode(password+'|'+salt);const buf=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}
async function makePassword(password){const salt=uid();return {salt,hash:await hashPassword(password,salt)}}
async function verifyPassword(password,u){if(!u?.passwordHash)return false;return (await hashPassword(password,u.passwordSalt))===u.passwordHash}
function Icon({name,size=18}){return <i data-lucide={name} style={{width:size,height:size}}/>}
function useIcons(){useEffect(()=>{window.lucide?.createIcons()},[])}
function Button({children,onClick,variant='primary',disabled=false,type='button',className=''}){const c={primary:'bg-slate-900 text-white hover:bg-slate-800',secondary:'bg-white border border-slate-200 hover:bg-slate-50',danger:'bg-red-600 text-white hover:bg-red-700',ghost:'hover:bg-slate-100 text-slate-700'}[variant];return <button type={type} disabled={disabled} onClick={onClick} className={'rounded-xl px-4 py-2.5 text-sm font-semibold transition disabled:opacity-50 '+c+' '+className}>{children}</button>}
function Input({label,...p}){return <label className="block"><span className="text-xs font-semibold text-slate-600">{label}</span><input {...p} className="mt-1.5 w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm outline-none focus:border-slate-500 focus:ring-2 focus:ring-slate-100"/></label>}
function Select({label,children,...p}){return <label className="block"><span className="text-xs font-semibold text-slate-600">{label}</span><select {...p} className="mt-1.5 w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm outline-none">{children}</select></label>}
function Empty({title,body}){return <div className="rounded-2xl border border-dashed border-slate-300 bg-white p-10 text-center"><div className="mx-auto mb-3 w-fit rounded-full bg-slate-100 p-3"><Icon name="database"/></div><h3 className="font-bold">{title}</h3><p className="mt-1 text-sm text-slate-500">{body}</p></div>}
function Modal({title,onClose,children}){return <div className="fixed inset-0 z-[100] bg-black/40 flex items-center justify-center p-4"><div className="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-auto"><div className="p-5 border-b flex justify-between items-center"><h2 className="font-bold">{title}</h2><button onClick={onClose}><Icon name="x"/></button></div><div className="p-5">{children}</div></div></div>}
function Setup({onDone}){const [f,setF]=useState({name:'Amaal Telecoms',email:'',password:'',phone:'',address:''}),[err,setErr]=useState(''),[busy,setBusy]=useState(false);async function submit(e){e.preventDefault();if(!f.email||!f.password)return setErr('Administrator email and password are required.');if(f.password.length<10)return setErr('Use at least 10 characters for the administrator password.');setBusy(true);const db=emptyDB(),u={id:uid(),name:'Administrator',email:f.email.trim().toLowerCase(),roleId:'super-admin',status:'Active',createdAt:now(),failedAttempts:0,lockedUntil:null,branchId:null,...await makePassword(f.password)};db.company={name:f.name.trim()||'Amaal Telecoms',email:u.email,phone:f.phone.trim(),address:f.address.trim()};db.users=[u];db.setup=true;db.session={userId:u.id,createdAt:now(),lastActivityAt:Date.now()};audit(db,'INITIAL_SETUP','System','Created the first administrator account',u);save(db);setBusy(false);onDone(db)}return <Auth title="Set up Amaal Admin" subtitle="Create the real first administrator. No demo records are created."><form onSubmit={submit} className="space-y-4"><Input label="Company name" value={f.name} onChange={e=>setF({...f,name:e.target.value})}/><Input label="Administrator email" type="email" required value={f.email} onChange={e=>setF({...f,email:e.target.value})}/><Input label="Administrator password" type="password" required value={f.password} onChange={e=>setF({...f,password:e.target.value})}/><Input label="Phone" value={f.phone} onChange={e=>setF({...f,phone:e.target.value})}/><Input label="Address" value={f.address} onChange={e=>setF({...f,address:e.target.value})}/>{err&&<p className="text-sm text-red-600">{err}</p>}<Button disabled={busy} type="submit" className="w-full">{busy?'Creating…':'Create Admin & Continue'}</Button></form></Auth>}
function Auth({title,subtitle,children}){return <div className="min-h-full flex items-center justify-center p-5 bg-slate-950"><div className="w-full max-w-md rounded-3xl bg-white p-7 shadow-2xl"><div className="mb-7"><div className="w-11 h-11 rounded-2xl bg-slate-900 text-white flex items-center justify-center mb-4"><Icon name="shield-check"/></div><h1 className="font-display text-2xl font-bold">{title}</h1><p className="mt-1 text-sm text-slate-500">{subtitle}</p></div>{children}</div></div>}
function Login({db,onLogin}){const [email,setEmail]=useState(db.company.email||''),[password,setPassword]=useState(''),[err,setErr]=useState(''),[busy,setBusy]=useState(false);async function submit(e){e.preventDefault();setBusy(true);const u=db.users.find(x=>x.email.toLowerCase()===email.trim().toLowerCase());if(!u){setErr('Invalid credentials.');setBusy(false);return}if(u.status!=='Active'){setErr('This account is inactive.');setBusy(false);return}if(u.lockedUntil&&Date.now()<new Date(u.lockedUntil).getTime()){setErr('Account temporarily locked. Try again later.');setBusy(false);return}const ok=await verifyPassword(password,u);if(!ok){const attempts=(u.failedAttempts||0)+1,limit=Number(db.settings.maxLoginAttempts)||5;const locked=attempts>=limit?new Date(Date.now()+(Number(db.settings.lockoutMinutes)||15)*60000).toISOString():null;const n={...db,users:db.users.map(x=>x.id===u.id?{...x,failedAttempts:attempts,lockedUntil:locked}:x)};n.securityEvents.unshift({id:uid(),at:now(),type:'LOGIN_FAILED',userId:u.id,email:u.email});n.audit.unshift({id:uid(),at:now(),action:'LOGIN_FAILED',resource:'Authentication',detail:locked?'Account locked after failed attempts':'Invalid credentials',userId:u.id,user:u.email,before:null,after:null,requestId:uid()});save(n);onLogin({...n,session:null});setErr(locked?'Too many attempts. Account temporarily locked.':'Invalid credentials.');setBusy(false);return}const n={...db,users:db.users.map(x=>x.id===u.id?{...x,failedAttempts:0,lockedUntil:null}:x),session:{userId:u.id,createdAt:now(),lastActivityAt:Date.now()}};audit(n,'LOGIN','Authentication','Administrator signed in',u);save(n);setBusy(false);onLogin(n)}return <Auth title="Amaal Telecoms Admin" subtitle="Secure administrator sign in."><form onSubmit={submit} className="space-y-4"><Input label="Email" type="email" required value={email} onChange={e=>setEmail(e.target.value)}/><Input label="Password" type="password" required value={password} onChange={e=>setPassword(e.target.value)}/>{err&&<p className="text-sm text-red-600">{err}</p>}<Button disabled={busy} type="submit" className="w-full">{busy?'Signing in…':'Sign in'}</Button></form></Auth>}
const NAV=[['Dashboard','layout-dashboard','dashboard.view'],['Staff','users','staff.view'],['Roles & Permissions','key-round','roles.view'],['Branches','building-2','branches.view'],['Audit Logs','history','audit.view'],['Notifications','bell','notifications.view'],['Settings','settings-2','settings.view'],['Catalog','package',null],['Inventory','warehouse',null],['Orders','shopping-cart',null],['Customers','user-round',null],['Payments','credit-card',null],['Reports','bar-chart-3',null]];
function Shell({db,setDb}){const user=db.users.find(u=>u.id===db.session?.userId),role=db.roles.find(r=>r.id===user?.roleId);const [view,setView]=useState('Dashboard'),[mobile,setMobile]=useState(false),[query,setQuery]=useState('');const has=p=>role?.permissions.includes('*')||role?.permissions.includes(p);function commit(next){setDb(next);save(next)}function logout(){let n={...db,session:null};n=audit(n,'LOGOUT','Authentication','Administrator signed out',user);commit(n)}useEffect(()=>{const mins=Number(db.settings.sessionMinutes)||60;const timer=setInterval(()=>{if(db.session&&Date.now()-db.session.lastActivityAt>mins*60000){let n={...db,session:null};n=audit(n,'SESSION_EXPIRED','Authentication','Session expired due to inactivity',user);commit(n)}},30000);return()=>clearInterval(timer)},[db.session?.lastActivityAt,db.settings.sessionMinutes]);function activity(){if(db.session){const n={...db,session:{...db.session,lastActivityAt:Date.now()}};setDb(n);save(n)}}return <div onClick={activity} className="h-full flex bg-slate-50"><aside className={(mobile?'fixed inset-y-0 left-0 z-50 ':'')+'w-64 bg-white border-r border-slate-200 flex flex-col '+(mobile?'':'hidden md:flex')}><div className="p-5 flex items-center justify-between"><div><div className="font-display font-bold text-lg">Amaal Telecoms</div><div className="text-[11px] text-slate-400">ADMIN CONSOLE · PHASE 1</div></div>{mobile&&<button onClick={()=>setMobile(false)}><Icon name="x"/></button>}</div><nav className="px-3 pb-4 overflow-y-auto scrollbar space-y-1">{NAV.map(([n,ic,perm])=>{if(perm&&!has(perm))return null;const future=!perm;return <button key={n} onClick={()=>{if(!future){setView(n);setMobile(false)}}} className={'w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-left '+(view===n?'bg-slate-900 text-white':'text-slate-600 hover:bg-slate-100')}>{<Icon name={ic} size={17}/>}<span>{n}</span>{future&&<span className="ml-auto text-[9px] uppercase tracking-wide text-slate-400">Next</span>}</button>})}</nav><div className="mt-auto p-3 border-t"><div className="rounded-xl bg-slate-50 p-3"><div className="text-xs text-slate-500">Signed in as</div><div className="text-sm font-semibold truncate">{user?.name}</div><div className="text-xs text-slate-400">{role?.name}</div><button onClick={logout} className="mt-2 text-xs font-semibold text-red-600">Sign out</button></div></div></aside>{mobile&&<div onClick={()=>setMobile(false)} className="fixed inset-0 z-40 bg-black/30 md:hidden"/>}<main className="flex-1 min-w-0 flex flex-col"><header className="h-16 bg-white border-b border-slate-200 flex items-center gap-3 px-4 md:px-6"><button className="md:hidden" onClick={()=>setMobile(true)}><Icon name="menu"/></button><div className="relative flex-1 max-w-xl"><Icon name="search" size={16}/><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search admin records..." className="absolute inset-0 pl-7 text-sm outline-none bg-transparent"/></div><button className="p-2 rounded-xl hover:bg-slate-100" onClick={()=>setView('Notifications')}><Icon name="bell"/></button><div className="text-right hidden sm:block"><div className="text-xs font-semibold">{user?.name}</div><div className="text-[11px] text-slate-400">{role?.name}</div></div></header><div className="flex-1 overflow-auto p-4 md:p-6 scrollbar"><View view={view} db={db} commit={commit} user={user} role={role} has={has} query={query} setView={setView}/></div></main></div>}
function Page({title,sub,action,children}){return <div className="max-w-7xl mx-auto"><div className="flex flex-col sm:flex-row sm:items-end justify-between gap-3 mb-6"><div><h1 className="font-display text-2xl font-bold">{title}</h1><p className="text-sm text-slate-500 mt-1">{sub}</p></div>{action}</div>{children}</div>}
function Dashboard({db,user}){const active=db.users.filter(x=>x.status==='Active').length;const locked=db.users.filter(x=>x.lockedUntil&&Date.now()<new Date(x.lockedUntil).getTime()).length;return <Page title="Dashboard" sub="Administrative health and activity using persisted records."><div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">{[['Staff',db.users.length,'users'],['Active staff',active,'user-check'],['Branches',db.branches.length,'building-2'],['Locked accounts',locked,'lock']].map(([a,b,i])=><div key={a} className="bg-white border rounded-2xl p-5"><div className="text-sm text-slate-500">{a}</div><div className="text-3xl font-display font-bold mt-2">{b}</div><div className="mt-3 text-slate-400"><Icon name={i} size={18}/></div></div>)}</div><div className="grid lg:grid-cols-2 gap-5 mt-5"><section className="bg-white border rounded-2xl p-5"><h2 className="font-bold">Security status</h2><div className="mt-4 space-y-3 text-sm"><div className="flex justify-between"><span className="text-slate-500">Session timeout</span><b>{db.settings.sessionMinutes} min</b></div><div className="flex justify-between"><span className="text-slate-500">Login attempt limit</span><b>{db.settings.maxLoginAttempts}</b></div><div className="flex justify-between"><span className="text-slate-500">Audit events</span><b>{db.audit.length}</b></div></div></section><section className="bg-white border rounded-2xl p-5"><h2 className="font-bold">Recent activity</h2>{db.audit.slice(0,7).map(a=><div key={a.id} className="py-3 border-b last:border-0"><div className="text-sm font-semibold">{a.action}</div><div className="text-xs text-slate-500">{a.detail} · {new Date(a.at).toLocaleString()}</div></div>)}{!db.audit.length&&<p className="text-sm text-slate-500 mt-3">No administrative activity yet.</p>}</section></div></Page>}
function Staff({db,commit,user}){const [open,setOpen]=useState(false),[edit,setEdit]=useState(null),[f,setF]=useState({name:'',email:'',password:'',roleId:db.roles[0]?.id||'super-admin',branchId:''});async function add(e){e.preventDefault();if(db.users.some(u=>u.email.toLowerCase()===f.email.trim().toLowerCase()))return alert('Email already exists.');const pw=await makePassword(f.password);const u={id:uid(),name:f.name.trim(),email:f.email.trim().toLowerCase(),roleId:f.roleId,status:'Active',createdAt:now(),failedAttempts:0,lockedUntil:null,branchId:f.branchId||null,...pw};let n={...db,users:[...db.users,u]};n=audit(n,'STAFF_CREATED','Staff',`Created ${u.email}`,user,null,{id:u.id,email:u.email,roleId:u.roleId,branchId:u.branchId});commit(n);setOpen(false);setF({name:'',email:'',password:'',roleId:db.roles[0]?.id||'super-admin',branchId:''})}function toggle(u){if(u.id===user.id)return alert('You cannot suspend your own account.');const next=u.status==='Active'?'Suspended':'Active';let n={...db,users:db.users.map(x=>x.id===u.id?{...x,status:next,lockedUntil:null,failedAttempts:0}:x)};n=audit(n,'STAFF_STATUS_CHANGED','Staff',`${u.email} changed to ${next}`,user,{status:u.status},{status:next});commit(n)}function unlock(u){let n={...db,users:db.users.map(x=>x.id===u.id?{...x,lockedUntil:null,failedAttempts:0}:x)};n=audit(n,'ACCOUNT_UNLOCKED','Staff',`Unlocked ${u.email}`,user);commit(n)}function update(e){e.preventDefault();let n={...db,users:db.users.map(x=>x.id===edit.id?{...x,name:f.name.trim(),roleId:f.roleId,branchId:f.branchId||null}:x)};n=audit(n,'STAFF_UPDATED','Staff',`Updated ${edit.email}`,user);commit(n);setEdit(null)}return <Page title="Staff" sub="Manage administrator accounts, roles, branch scope and security state." action={db.users.length?<Button onClick={()=>setOpen(true)}><Icon name="user-plus" size={16}/> Add staff</Button>:null}><div className="bg-white border rounded-2xl overflow-auto"><table className="w-full text-sm"><thead className="bg-slate-50 text-xs text-slate-500"><tr><th className="text-left p-4">Name</th><th className="text-left p-4">Email</th><th className="text-left p-4">Role</th><th className="text-left p-4">Branch</th><th className="text-left p-4">Status</th><th className="p-4"></th></tr></thead><tbody>{db.users.map(u=>{const locked=u.lockedUntil&&Date.now()<new Date(u.lockedUntil).getTime();return <tr key={u.id} className="border-t"><td className="p-4 font-semibold">{u.name}</td><td className="p-4">{u.email}</td><td className="p-4">{db.roles.find(r=>r.id===u.roleId)?.name||'—'}</td><td className="p-4">{db.branches.find(b=>b.id===u.branchId)?.name||'All branches'}</td><td className="p-4"><span className="rounded-full bg-slate-100 px-2.5 py-1 text-xs">{locked?'Locked':u.status}</span></td><td className="p-4 text-right whitespace-nowrap"><Button variant="secondary" onClick={()=>{setEdit(u);setF({name:u.name,email:u.email,password:'',roleId:u.roleId,branchId:u.branchId||''})}}>Edit</Button> {locked&&<Button variant="secondary" onClick={()=>unlock(u)}>Unlock</Button>} {u.id!==user.id&&<Button variant="secondary" onClick={()=>toggle(u)}>{u.status==='Active'?'Suspend':'Activate'}</Button>}</td></tr>})}</tbody></table>{!db.users.length&&<Empty title="No staff accounts" body="Create the first administrator account during setup."/>}</div>{(open||edit)&&<Modal title={open?'Add staff':'Edit staff'} onClose={()=>{setOpen(false);setEdit(null)}}><form onSubmit={open?add:update} className="space-y-4"><Input label="Full name" required value={f.name} onChange={e=>setF({...f,name:e.target.value})}/><Input label="Email" type="email" disabled={!!edit} required value={f.email} onChange={e=>setF({...f,email:e.target.value})}/>{open&&<Input label="Temporary password" type="password" minLength="10" required value={f.password} onChange={e=>setF({...f,password:e.target.value})}/>}<Select label="Role" value={f.roleId} onChange={e=>setF({...f,roleId:e.target.value})}>{db.roles.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}</Select><Select label="Branch scope" value={f.branchId} onChange={e=>setF({...f,branchId:e.target.value})}><option value="">All branches</option>{db.branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</Select><Button type="submit" className="w-full">{open?'Create staff account':'Save changes'}</Button></form></Modal>}</Page>}
function Roles({db,commit,user}){const [selected,setSelected]=useState(db.roles[0]?.id),[open,setOpen]=useState(false),[f,setF]=useState({name:'',description:''}),role=db.roles.find(r=>r.id===selected);function toggle(p){if(role.system)return;let n={...db,roles:db.roles.map(r=>r.id===role.id?{...r,permissions:r.permissions.includes(p)?r.permissions.filter(x=>x!==p):[...r.permissions,p]}:r)};n=audit(n,'ROLE_PERMISSION_CHANGED','Role',`Updated permissions for ${role.name}`,user);commit(n)}function add(e){e.preventDefault();if(db.roles.some(r=>r.name.toLowerCase()===f.name.trim().toLowerCase()))return alert('Role already exists.');const r={id:uid(),name:f.name.trim(),description:f.description.trim(),system:false,permissions:[]};let n={...db,roles:[...db.roles,r]};n=audit(n,'ROLE_CREATED','Role',`Created ${r.name}`,user);commit(n);setSelected(r.id);setOpen(false);setF({name:'',description:''})}return <Page title="Roles & Permissions" sub="Granular access control. System roles are protected; custom roles can be configured." action={<Button onClick={()=>setOpen(true)}><Icon name="plus" size={16}/> Create role</Button>}><div className="grid lg:grid-cols-[240px_1fr] gap-5"><div className="bg-white border rounded-2xl p-2">{db.roles.map(r=><button key={r.id} onClick={()=>setSelected(r.id)} className={'w-full text-left p-3 rounded-xl '+(selected===r.id?'bg-slate-900 text-white':'hover:bg-slate-50')}><div className="font-semibold text-sm">{r.name}</div><div className="text-xs opacity-60 mt-1">{r.permissions.length} permissions</div></button>)}</div>{role&&<div className="bg-white border rounded-2xl p-5"><div className="flex justify-between gap-3"><div><h2 className="font-bold text-lg">{role.name}</h2><p className="text-sm text-slate-500 mt-1">{role.description}</p></div>{role.system&&<span className="text-xs bg-slate-100 px-2 py-1 rounded-full h-fit">System role</span>}</div><div className="grid sm:grid-cols-2 gap-3 mt-6">{PERMISSIONS.map(([id,label])=><label key={id} className={'flex items-center gap-3 border rounded-xl p-3 '+(role.system?'opacity-60':'cursor-pointer')}><input disabled={role.system} type="checkbox" checked={role.permissions.includes(id)} onChange={()=>toggle(id)}/><span className="text-sm">{label}</span></label>)}</div></div>}</div>{open&&<Modal title="Create custom role" onClose={()=>setOpen(false)}><form onSubmit={add} className="space-y-4"><Input label="Role name" required value={f.name} onChange={e=>setF({...f,name:e.target.value})}/><Input label="Description" value={f.description} onChange={e=>setF({...f,description:e.target.value})}/><Button type="submit" className="w-full">Create role</Button></form></Modal>}</Page>}
function Branches({db,commit,user}){const [open,setOpen]=useState(false),[f,setF]=useState({name:'',address:''});function add(e){e.preventDefault();if(db.branches.some(b=>b.name.toLowerCase()===f.name.trim().toLowerCase()))return alert('Branch already exists.');const b={id:uid(),name:f.name.trim(),address:f.address.trim(),status:'Active',createdAt:now()};let n={...db,branches:[...db.branches,b]};n=audit(n,'BRANCH_CREATED','Branch',`Created ${b.name}`,user,null,b);commit(n);setF({name:'',address:''});setOpen(false)}function toggle(b){const next=b.status==='Active'?'Inactive':'Active';let n={...db,branches:db.branches.map(x=>x.id===b.id?{...x,status:next}:x)};n=audit(n,'BRANCH_STATUS_CHANGED','Branch',`${b.name} changed to ${next}`,user,{status:b.status},{status:next});commit(n)}return <Page title="Branches" sub="Real locations used for future inventory, staff scope and reporting." action={<Button onClick={()=>setOpen(true)}><Icon name="plus" size={16}/> Add branch</Button>}>{db.branches.length===0?<Empty title="No branches configured" body="Add your first real Amaal Telecoms branch."/>:<div className="grid md:grid-cols-2 xl:grid-cols-3 gap-4">{db.branches.map(b=><div key={b.id} className="bg-white border rounded-2xl p-5"><div className="flex justify-between gap-3"><h3 className="font-bold">{b.name}</h3><span className="text-xs bg-slate-100 px-2 py-1 rounded-full">{b.status}</span></div><p className="mt-2 text-sm text-slate-500">{b.address||'No address provided'}</p><Button variant="secondary" className="mt-4" onClick={()=>toggle(b)}>{b.status==='Active'?'Deactivate':'Activate'}</Button></div>)}</div>}{open&&<Modal title="Add branch" onClose={()=>setOpen(false)}><form onSubmit={add} className="space-y-4"><Input label="Branch name" required value={f.name} onChange={e=>setF({...f,name:e.target.value})}/><Input label="Address" value={f.address} onChange={e=>setF({...f,address:e.target.value})}/><Button type="submit" className="w-full">Create branch</Button></form></Modal>}</Page>}
function Audit({db,query}){const rows=db.audit.filter(a=>JSON.stringify(a).toLowerCase().includes(query.toLowerCase()));return <Page title="Audit Logs" sub="Administrative actions with actor, request, branch and before/after context.">{rows.length?<div className="bg-white border rounded-2xl overflow-auto"><table className="w-full text-sm"><thead className="bg-slate-50 text-xs text-slate-500"><tr><th className="p-4 text-left">Time</th><th className="p-4 text-left">Action</th><th className="p-4 text-left">Resource</th><th className="p-4 text-left">User</th><th className="p-4 text-left">Detail</th></tr></thead><tbody>{rows.map(a=><tr className="border-t" key={a.id}><td className="p-4 whitespace-nowrap">{new Date(a.at).toLocaleString()}</td><td className="p-4 font-semibold">{a.action}</td><td className="p-4">{a.resource}</td><td className="p-4">{a.user}</td><td className="p-4 text-slate-500">{a.detail}</td></tr>)}</tbody></table></div>:<Empty title="No audit events" body="Administrative activity will appear here."/>}</Page>}
function Notifications({db,commit,user}){const [text,setText]=useState('');function add(e){e.preventDefault();if(!text.trim())return;let n={...db,notifications:[{id:uid(),text:text.trim(),read:false,at:now(),userId:user.id},...db.notifications]};n=audit(n,'NOTIFICATION_CREATED','Notification',text.trim(),user);commit(n);setText('')}function mark(id){let n={...db,notifications:db.notifications.map(x=>x.id===id?{...x,read:true}:x)};n=audit(n,'NOTIFICATION_READ','Notification',`Marked notification ${id} as read`,user);commit(n)}return <Page title="Notifications" sub="Persistent in-console notifications with read state."><form onSubmit={add} className="bg-white border rounded-2xl p-4 flex gap-2 mb-5"><input value={text} onChange={e=>setText(e.target.value)} placeholder="Create a notification..." className="flex-1 border rounded-xl px-3 py-2.5 outline-none"/><Button type="submit">Add</Button></form>{db.notifications.length?<div className="space-y-2">{db.notifications.map(n=><div key={n.id} className={'bg-white border rounded-2xl p-4 flex justify-between gap-3 '+(!n.read?'border-l-4 border-l-slate-900':'')}><div><div className="font-semibold text-sm">{n.text}</div><div className="text-xs text-slate-400 mt-1">{new Date(n.at).toLocaleString()}</div></div>{!n.read&&<Button variant="secondary" onClick={()=>mark(n.id)}>Mark read</Button>}</div>)}</div>:<Empty title="No notifications" body="No in-console notifications exist yet."/>}</Page>}
function Settings({db,commit,user}){const [f,setF]=useState({...db.company,...db.settings}),[passwords,setPasswords]=useState({current:'',next:'',confirm:''}),[busy,setBusy]=useState(false);async function saveIt(e){e.preventDefault();const n={...db,company:{name:f.name.trim(),email:f.email.trim(),phone:f.phone.trim(),address:f.address.trim()},settings:{currency:f.currency,timezone:f.timezone,sessionMinutes:Number(f.sessionMinutes)||60,maxLoginAttempts:Number(f.maxLoginAttempts)||5,lockoutMinutes:Number(f.lockoutMinutes)||15}};audit(n,'SETTINGS_UPDATED','System Settings','Updated company and security settings',user,db.settings,n.settings);commit(n);alert('Settings saved.')}async function changePassword(e){e.preventDefault();if(passwords.next.length<10||passwords.next!==passwords.confirm)return alert('New passwords must match and contain at least 10 characters.');setBusy(true);const u=db.users.find(x=>x.id===user.id);if(!(await verifyPassword(passwords.current,u))){setBusy(false);return alert('Current password is incorrect.')}const pw=await makePassword(passwords.next);let n={...db,users:db.users.map(x=>x.id===u.id?{...x,...pw}:x)};n=audit(n,'PASSWORD_CHANGED','Authentication','Administrator changed their password',user);commit(n);setPasswords({current:'',next:'',confirm:''});setBusy(false);alert('Password changed.')}return <Page title="Settings" sub="Company configuration, session policy and account security."><div className="max-w-4xl space-y-5"><form onSubmit={saveIt} className="space-y-5"><section className="bg-white border rounded-2xl p-5"><h2 className="font-bold">Company</h2><div className="grid md:grid-cols-2 gap-4 mt-4"><Input label="Company name" value={f.name} onChange={e=>setF({...f,name:e.target.value})}/><Input label="Email" type="email" value={f.email} onChange={e=>setF({...f,email:e.target.value})}/><Input label="Phone" value={f.phone} onChange={e=>setF({...f,phone:e.target.value})}/><Input label="Address" value={f.address} onChange={e=>setF({...f,address:e.target.value})}/></div></section><section className="bg-white border rounded-2xl p-5"><h2 className="font-bold">Security policy</h2><div className="grid md:grid-cols-3 gap-4 mt-4"><Input label="Session timeout (minutes)" type="number" min="5" value={f.sessionMinutes} onChange={e=>setF({...f,sessionMinutes:e.target.value})}/><Input label="Max login attempts" type="number" min="3" value={f.maxLoginAttempts} onChange={e=>setF({...f,maxLoginAttempts:e.target.value})}/><Input label="Lockout (minutes)" type="number" min="1" value={f.lockoutMinutes} onChange={e=>setF({...f,lockoutMinutes:e.target.value})}/></div></section><section className="bg-white border rounded-2xl p-5"><h2 className="font-bold">Localization</h2><div className="grid md:grid-cols-2 gap-4 mt-4"><Input label="Currency" value={f.currency} onChange={e=>setF({...f,currency:e.target.value})}/><Input label="Timezone" value={f.timezone} onChange={e=>setF({...f,timezone:e.target.value})}/></div></section><Button type="submit">Save settings</Button></form><form onSubmit={changePassword} className="bg-white border rounded-2xl p-5"><h2 className="font-bold">Change your password</h2><div className="grid md:grid-cols-3 gap-4 mt-4"><Input label="Current password" type="password" required value={passwords.current} onChange={e=>setPasswords({...passwords,current:e.target.value})}/><Input label="New password" type="password" required value={passwords.next} onChange={e=>setPasswords({...passwords,next:e.target.value})}/><Input label="Confirm new password" type="password" required value={passwords.confirm} onChange={e=>setPasswords({...passwords,confirm:e.target.value})}/></div><Button disabled={busy} className="mt-4">{busy?'Changing…':'Change password'}</Button></form></div></Page>}
function Future({name}){return <Page title={name} sub="This module is deliberately not populated with demo records."><Empty title="Phase not built yet" body="It will be connected to the real data model in a later incremental phase. No mock business records are displayed."/></Page>}
function View({view,db,commit,user,query,role}){if(view==='Dashboard')return <Dashboard db={db} user={user}/>;if(view==='Staff')return <Staff db={db} commit={commit} user={user}/>;if(view==='Roles & Permissions')return <Roles db={db} commit={commit} user={user}/>;if(view==='Branches')return <Branches db={db} commit={commit} user={user}/>;if(view==='Audit Logs')return <Audit db={db} query={query}/>;if(view==='Notifications')return <Notifications db={db} commit={commit} user={user}/>;if(view==='Settings')return <Settings db={db} commit={commit} user={user}/>;return <Future name={view}/>}
function App(){const [db,setDb]=useState(()=>normalize(load()||emptyDB()));useIcons();useEffect(()=>{if(db.version!==2){const n=normalize(db);setDb(n);save(n)}},[]);if(!db.setup)return <Setup onDone={setDb}/>;if(!db.session)return <Login db={db} onLogin={setDb}/>;return <Shell db={db} setDb={setDb}/>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
