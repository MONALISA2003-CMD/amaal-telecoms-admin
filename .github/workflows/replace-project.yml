name: Replace Project From ZIP

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "**/*.zip"

permissions:
  contents: write

jobs:
  replace-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find newest project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          # On normal pushes, prefer a newly added/modified ZIP.
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            if [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              ZIP_FILE=$(
                git diff --name-status "$BEFORE" "$AFTER" \
                | awk '$1 == "A" || $1 == "M" {print $2}' \
                | grep -E '\.zip$' \
                | tail -n 1 || true
              )
            fi
          fi

          # Manual workflow dispatch or fallback.
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(
              find . \
                -type f \
                -name "*.zip" \
                -not -path "./.git/*" \
                -printf "%T@ %p\n" \
                | sort -nr \
                | head -n 1 \
                | cut -d' ' -f2- || true
            )
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "No project ZIP found."
            exit 0
          fi

          echo "Using project ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/new-project
          mkdir -p /tmp/new-project

          unzip -q -o "$ZIP_FILE" -d /tmp/new-project

          echo "ZIP extracted successfully."

      - name: Detect complete project root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          # Expected structure:
          #
          # package.json
          # server.js
          # apps/
          #   business-admin/
          #     package.json
          #
          BUSINESS_PACKAGE=$(
            find /tmp/new-project \
              -type f \
              -path "*/apps/business-admin/package.json" \
              | head -n 1
          )

          if [ -n "$BUSINESS_PACKAGE" ]; then
            PROJECT_ROOT="$(dirname "$(dirname "$(dirname "$BUSINESS_PACKAGE")")")"
          fi

          # Fallback for a ZIP extracted directly at its root.
          if [ -z "$PROJECT_ROOT" ] && \
             [ -f "/tmp/new-project/package.json" ] && \
             [ -f "/tmp/new-project/server.js" ]; then
            PROJECT_ROOT="/tmp/new-project"
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Could not locate the complete project."
            echo "Expected apps/business-admin/package.json."
            exit 1
          fi

          echo "Detected project root:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Validate complete project
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating project..."

          test -f "$PROJECT_ROOT/package.json"
          test -f "$PROJECT_ROOT/server.js"
          test -f "$PROJECT_ROOT/schema.sql"
          test -d "$PROJECT_ROOT/public"

          test -f "$PROJECT_ROOT/apps/business-admin/package.json"
          test -f "$PROJECT_ROOT/apps/business-admin/next.config.ts"
          test -f "$PROJECT_ROOT/apps/business-admin/tsconfig.json"
          test -f "$PROJECT_ROOT/apps/business-admin/proxy.ts"

          echo ""
          echo "================================"
          echo "COMPLETE PROJECT VALIDATED"
          echo "================================"

      - name: Validate Business Admin
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT/apps/business-admin"

          echo "Business Admin package:"
          node -e "const p=require('./package.json'); console.log(p.name); console.log('next:', p.dependencies?.next || p.devDependencies?.next); console.log('react-query:', p.dependencies?.['@tanstack/react-query'] || p.devDependencies?.['@tanstack/react-query']);"

          if [ ! -f proxy.ts ]; then
            echo "ERROR: proxy.ts missing."
            exit 1
          fi

          if [ -f middleware.ts ]; then
            echo "ERROR: obsolete middleware.ts still exists."
            exit 1
          fi

          echo "Business Admin validation passed."

      - name: Validate Express backend
        shell: bash
        run: |
          set -euo pipefail

          if grep -F "app.get('*'" "$PROJECT_ROOT/server.js"; then
            echo "ERROR: Old Express wildcard route detected."
            exit 1
          fi

          if grep -F "app.get('/{*splat}'" "$PROJECT_ROOT/server.js"; then
            echo "Express 5 wildcard route verified."
          else
            echo "WARNING: Express 5 wildcard route was not found."
            echo "Continuing because the backend may use a different routing structure."
          fi

      - name: Prepare replacement
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/project-to-install
          mkdir -p /tmp/project-to-install

          cp -a "$PROJECT_ROOT"/. /tmp/project-to-install/

          echo "New project snapshot prepared."

      - name: Remove old project files
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing old application files..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          echo "Old application removed."

      - name: Install new project
        shell: bash
        run: |
          set -euo pipefail

          cp -a /tmp/project-to-install/. .

          echo "New project installed."

      - name: Remove ALL old ZIP files
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing all project ZIP files..."

          find . \
            -type f \
            -name "*.zip" \
            -not -path "./.git/*" \
            -print \
            -delete

          echo "All ZIP files removed."

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          echo "Running final verification..."

          test -f package.json
          test -f server.js
          test -f schema.sql
          test -d public

          test -f apps/business-admin/package.json
          test -f apps/business-admin/next.config.ts
          test -f apps/business-admin/tsconfig.json
          test -f apps/business-admin/proxy.ts

          if [ -f apps/business-admin/middleware.ts ]; then
            echo "ERROR: middleware.ts still exists."
            exit 1
          fi

          if find . -type f -name "*.zip" -not -path "./.git/*" | grep -q .; then
            echo "ERROR: ZIP files still remain."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "PROJECT REPLACEMENT VERIFIED"
          echo "======================================"

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Replace application with latest project snapshot"
          git push
