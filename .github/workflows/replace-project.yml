name: Replace Business Platform From ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  replace-business-platform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find replacement ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_COUNT=$(find . -maxdepth 1 -type f -name "*.zip" | wc -l)

          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo "No replacement ZIP found."
            exit 1
          fi

          if [ "$ZIP_COUNT" -gt 1 ]; then
            echo "More than one ZIP found:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            echo "Please keep only the intended replacement ZIP."
            exit 1
          fi

          ZIP_PATH=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "Using replacement ZIP: $ZIP_PATH"

      - name: Prepare extraction directory
        run: |
          set -euo pipefail
          rm -rf .replacement
          mkdir -p .replacement

      - name: Extract replacement ZIP
        env:
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
        run: |
          set -euo pipefail

          unzip -q "$ZIP_PATH" -d .replacement

          echo "Extracted replacement package:"
          find .replacement -maxdepth 2 -type f | sort | head -100

      - name: Detect project root
        id: root
        shell: bash
        run: |
          set -euo pipefail

          if [ -f ".replacement/package.json" ] && [ -f ".replacement/server.js" ]; then
            echo "root=.replacement" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CANDIDATES=$(find .replacement -mindepth 1 -maxdepth 2 -type f \
            -name "package.json" \
            -printf '%h\n' | sort -u)

          FOUND=""

          while IFS= read -r DIR; do
            [ -z "$DIR" ] && continue

            if [ -f "$DIR/package.json" ] && [ -f "$DIR/server.js" ]; then
              if [ -z "$FOUND" ]; then
                FOUND="$DIR"
              else
                echo "Multiple possible backend roots found:"
                echo "$FOUND"
                echo "$DIR"
                exit 1
              fi
            fi
          done <<< "$CANDIDATES"

          if [ -z "$FOUND" ]; then
            echo "Could not find backend root containing package.json and server.js."
            exit 1
          fi

          echo "root=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Validate replacement package
        env:
          SOURCE_ROOT: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail

          echo "Validating replacement package at: $SOURCE_ROOT"

          test -f "$SOURCE_ROOT/package.json"
          test -f "$SOURCE_ROOT/server.js"
          test -f "$SOURCE_ROOT/render-preflight.js"

          if [ ! -d "$SOURCE_ROOT/apps/business-admin" ]; then
            echo "ERROR: apps/business-admin is missing from replacement ZIP."
            exit 1
          fi

          if [ -d "$SOURCE_ROOT/apps/public-web" ]; then
            echo "ERROR: Public website detected in replacement ZIP."
            echo "The replacement package must NOT contain apps/public-web."
            exit 1
          fi

          node -e "
            const p = require('./$SOURCE_ROOT/package.json');
            if (!p.scripts || !p.scripts.start) {
              throw new Error('Root package.json is missing scripts.start');
            }
            console.log('Root package:', p.name);
            console.log('Start command:', p.scripts.start);
          "

      - name: Protect public website
        run: |
          set -euo pipefail

          if [ ! -d "apps/public-web" ]; then
            echo "WARNING: apps/public-web does not currently exist in repository."
            echo "The workflow will not create or delete it."
          else
            echo "Public website found and will be preserved:"
            du -sh apps/public-web
          fi

      - name: Remove old Business Admin
        run: |
          set -euo pipefail

          rm -rf apps/business-admin

          echo "Old Business Admin removed."

      - name: Remove old root backend
        run: |
          set -euo pipefail

          # These are backend/application files that belong to the
          # Render root deployment.
          #
          # IMPORTANT:
          # apps/public-web is NOT touched.

          BACKEND_FILES=(
            "server.js"
            "render-preflight.js"
            "package.json"
            "package-lock.json"
            "npm-shrinkwrap.json"

            "deployment-readiness.js"
            "production-smoke.js"
            "cross-module-audit.js"
            "schema-reconciliation-audit.js"

            "inventory-unit-audit.js"
            "receiving-batch-audit.js"
            "warehouse-transfer-audit.js"
            "order-serial-assignment-audit.js"
            "serialized-status-history-audit.js"
            "fulfilment-delivery-audit.js"

            "tv-master-catalogue-audit.js"
            "audio-catalogue-audit.js"

            "phase017-020-deep-audit.js"
            "phase016-deep-audit.js"
            "phase18-security-regression.js"
          )

          for FILE in "${BACKEND_FILES[@]}"; do
            if [ -e "$FILE" ]; then
              rm -rf "$FILE"
              echo "Removed old: $FILE"
            fi
          done

      - name: Remove old backend modules
        run: |
          set -euo pipefail

          # Remove root-level backend service modules from the previous
          # deployment. The replacement ZIP will restore the current set.

          for FILE in \
            suppliers-procurement.js \
            customers-crm.js \
            sales-pos.js \
            orders-ecommerce.js \
            web-and-hosting.js \
            pricing-promotions.js \
            delivery-logistics.js \
            warranty-repairs.js \
            returns-refunds.js \
            document-management.js \
            credit-installments.js \
            finance-accounting.js \
            business-intelligence.js \
            ai-business-intelligence.js \
            integration-hub.js \
            global-search-ux.js \
            media-management.js \
            system-operations.js \
            monitoring-observability.js \
            backup-recovery.js \
            inventory-serialized.js \
            serialized-unit-lifecycle.js
          do
            if [ -e "$FILE" ]; then
              rm -rf "$FILE"
              echo "Removed old backend module: $FILE"
            fi
          done

      - name: Remove old database SQL
        run: |
          set -euo pipefail

          # Database schema/migrations are supplied by the replacement ZIP.
          # Remove old root-level SQL files only.
          #
          # Public website is untouched.

          find . -maxdepth 1 -type f \
            \( -name "*.sql" -o -name "*.pgsql" \) \
            -print \
            -delete

          echo "Old root database SQL files removed."

      - name: Copy replacement Business Platform
        env:
          SOURCE_ROOT: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail

          echo "Copying replacement Business Platform..."

          # Copy everything except the public website.
          rsync -a \
            --exclude="apps/public-web/" \
            "$SOURCE_ROOT/" \
            ./

      - name: Verify public website was preserved
        run: |
          set -euo pipefail

          if [ -d "apps/public-web" ]; then
            echo "SUCCESS: apps/public-web still exists."
          else
            echo "ERROR: apps/public-web is missing."
            echo "The workflow must never remove the public website."
            exit 1
          fi

      - name: Verify Render root deployment
        run: |
          set -euo pipefail

          echo "Checking Render root deployment..."

          test -f "package.json"
          test -f "server.js"
          test -f "render-preflight.js"

          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));

            if (!p.scripts || !p.scripts.start) {
              throw new Error('Missing root start script');
            }

            if (!p.engines || !p.engines.node) {
              console.warn('WARNING: Node engine is not defined');
            }

            console.log('Render root package verified.');
            console.log('Node:', p.engines?.node || 'not specified');
            console.log('Start:', p.scripts.start);
          "

      - name: Verify Business Admin
        run: |
          set -euo pipefail

          test -f "apps/business-admin/package.json"

          node -e "
            const fs = require('fs');
            const p = JSON.parse(
              fs.readFileSync('apps/business-admin/package.json', 'utf8')
            );

            if (!p.scripts || !p.scripts.build) {
              throw new Error('Business Admin is missing build script');
            }

            console.log('Business Admin verified.');
            console.log('Build:', p.scripts.build);
          "

      - name: Verify public website integrity
        run: |
          set -euo pipefail

          echo "Public website remains separate from replacement package."

          if [ -f "apps/public-web/package.json" ]; then
            echo "Public website package.json preserved."
          else
            echo "WARNING: apps/public-web/package.json not found."
          fi

      - name: Remove replacement ZIP and temporary files
        env:
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
        run: |
          set -euo pipefail

          rm -f "$ZIP_PATH"
          rm -rf .replacement

      - name: Show resulting structure
        run: |
          set -euo pipefail

          echo "=== Root ==="
          find . -maxdepth 1 -type f -print | sort

          echo
          echo "=== Applications ==="
          find apps -maxdepth 2 -type f \
            \( -name "package.json" -o -name "next.config.*" \) \
            -print | sort

          echo
          echo "=== Public website ==="
          if [ -d "apps/public-web" ]; then
            find apps/public-web -maxdepth 1 -type f -print | sort
          fi

      - name: Check Git status
        run: |
          git status --short

      - name: Commit replacement
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Replace Business Admin, Backend and Database"

      - name: Rebase latest main
        run: |
          set -euo pipefail

          git fetch origin main
          git rebase origin/main

      - name: Push replacement
        run: |
          set -euo pipefail

          git push origin HEAD:main
