name: Replace Project From ZIP

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "**/*.zip"

permissions:
  contents: write

concurrency:
  group: replace-project-main
  cancel-in-progress: true

jobs:
  replace-project:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Get the current repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # =========================================================
      # 2. Find a ZIP
      #
      # IMPORTANT:
      # If there is no ZIP, we do NOT fail.
      # All replacement steps below are skipped.
      # =========================================================
      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for project ZIP..."

          ZIP_FILE="$(
            find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              -printf "%T@ %p\n" \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2- || true
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP found."
            echo "This run was probably caused by a ZIP deletion or a manual workflow run."
            echo "Nothing needs to be replaced."

            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 3. Validate ZIP
      # =========================================================
      - name: Validate ZIP
        if: steps.zip.outputs.found == 'true'
        shell: bash
        env:
          ZIP_FILE: ${{ steps.zip.outputs.ZIP_FILE }}
        run: |
          set -euo pipefail

          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo "ZIP integrity check passed."

      # =========================================================
      # 4. Extract ZIP
      # =========================================================
      - name: Extract ZIP
        if: steps.zip.outputs.found == 'true'
        shell: bash
        env:
          ZIP_FILE: ${{ steps.zip.outputs.ZIP_FILE }}
        run: |
          set -euo pipefail

          rm -rf /tmp/project-extracted
          mkdir -p /tmp/project-extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q -o "$ZIP_FILE" -d /tmp/project-extracted

          echo "Extraction completed."

          echo ""
          echo "Extracted project structure:"
          find /tmp/project-extracted \
            -maxdepth 4 \
            -print \
            | sort \
            | head -300

      # =========================================================
      # 5. Detect the actual project root
      #
      # Supports:
      #
      # ZIP/
      #   package.json
      #
      # OR:
      #
      # ZIP/
      #   project-folder/
      #     package.json
      #
      # OR the current Amaal monorepo structure:
      #
      # project/
      #   apps/
      #     business-admin/
      #       package.json
      # =========================================================
      - name: Detect project root
        if: steps.zip.outputs.found == 'true'
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          # -----------------------------------------------------
          # Case 1: package.json is directly at extraction root
          # -----------------------------------------------------
          if [ -f "/tmp/project-extracted/package.json" ]; then
            ROOT="/tmp/project-extracted"
          fi

          # -----------------------------------------------------
          # Case 2: package.json is inside one project directory
          # -----------------------------------------------------
          if [ -z "$ROOT" ]; then
            FOUND="$(
              find /tmp/project-extracted \
                -mindepth 2 \
                -maxdepth 2 \
                -type f \
                -name "package.json" \
                | head -n 1 || true
            )"

            if [ -n "$FOUND" ]; then
              ROOT="$(dirname "$FOUND")"
            fi
          fi

          # -----------------------------------------------------
          # Case 3: package.json can be deeper in the ZIP
          # -----------------------------------------------------
          if [ -z "$ROOT" ]; then
            FOUND="$(
              find /tmp/project-extracted \
                -type f \
                -name "package.json" \
                | head -n 1 || true
            )"

            if [ -n "$FOUND" ]; then
              ROOT="$(dirname "$FOUND")"
            fi
          fi

          # -----------------------------------------------------
          # Case 4: specifically identify the current monorepo
          # -----------------------------------------------------
          BUSINESS_PACKAGE="$(
            find /tmp/project-extracted \
              -type f \
              -path "*/apps/business-admin/package.json" \
              | head -n 1 || true
          )"

          if [ -n "$BUSINESS_PACKAGE" ]; then
            BUSINESS_ROOT="$(dirname "$BUSINESS_PACKAGE")"
            MONOREPO_ROOT="$(dirname "$(dirname "$BUSINESS_ROOT")")"

            if [ -f "$MONOREPO_ROOT/package.json" ]; then
              ROOT="$MONOREPO_ROOT"
            fi
          fi

          # -----------------------------------------------------
          # Final check
          # -----------------------------------------------------
          if [ -z "$ROOT" ]; then
            echo "ERROR: Could not find the project root."
            echo ""
            echo "ZIP contents:"
            find /tmp/project-extracted \
              -maxdepth 6 \
              -print \
              | sort

            exit 1
          fi

          if [ ! -f "$ROOT/package.json" ]; then
            echo "ERROR: Detected root has no package.json:"
            echo "$ROOT"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "PROJECT ROOT DETECTED"
          echo "=========================================="
          echo "$ROOT"

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 6. Validate the new project BEFORE touching old files
      # =========================================================
      - name: Validate new project
        if: steps.zip.outputs.found == 'true'
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -euo pipefail

          echo "Validating new project..."

          test -f "$PROJECT_ROOT/package.json"

          echo "package.json: OK"

          if [ -d "$PROJECT_ROOT/apps/business-admin" ]; then
            echo "apps/business-admin detected."

            if [ -f "$PROJECT_ROOT/apps/business-admin/package.json" ]; then
              echo "business-admin/package.json: OK"
            else
              echo "WARNING: apps/business-admin exists but package.json is missing."
            fi
          fi

          echo ""
          echo "New project validation passed."

      # =========================================================
      # 7. Prepare a clean copy
      # =========================================================
      - name: Prepare new project
        if: steps.zip.outputs.found == 'true'
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -euo pipefail

          rm -rf /tmp/project-ready
          mkdir -p /tmp/project-ready

          cp -a "$PROJECT_ROOT"/. /tmp/project-ready/

          echo "New project copied to temporary staging area."

      # =========================================================
      # 8. Remove OLD application files
      #
      # .git is NEVER removed.
      # .github is NEVER removed.
      #
      # This protects the workflow that performs future replacements.
      # =========================================================
      - name: Remove old application
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing old application files..."

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          echo "Old application removed."

      # =========================================================
      # 9. Install EVERY file from the new project
      # =========================================================
      - name: Install new project
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cp -a /tmp/project-ready/. .

          echo "New project installed."

      # =========================================================
      # 10. Delete ALL ZIP files
      # =========================================================
      - name: Delete all ZIP files
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing all ZIP files from repository..."

          find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            -delete

          echo "All ZIP files deleted."

      # =========================================================
      # 11. Final verification
      # =========================================================
      - name: Verify replacement
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Running final verification..."

          test -f package.json

          echo "Root package.json: OK"

          if [ -d "apps/business-admin" ]; then
            test -f "apps/business-admin/package.json"
            echo "Business Admin package.json: OK"
          fi

          REMAINING_ZIPS="$(
            find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              | head -n 1 || true
          )"

          if [ -n "$REMAINING_ZIPS" ]; then
            echo "ERROR: A ZIP file still exists:"
            echo "$REMAINING_ZIPS"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "PROJECT REPLACEMENT VERIFIED"
          echo "=========================================="

      # =========================================================
      # 12. Commit
      # =========================================================
      - name: Commit replacement
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Replace project from uploaded ZIP"

      # =========================================================
      # 13. Synchronize with latest main
      #
      # Prevents the non-fast-forward error we saw in run #91.
      # =========================================================
      - name: Synchronize with latest main
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          git rebase origin/main

      # =========================================================
      # 14. Push replacement
      # =========================================================
      - name: Push replacement
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main

          echo ""
          echo "=========================================="
          echo "PROJECT SUCCESSFULLY PUSHED TO MAIN"
          echo "=========================================="
