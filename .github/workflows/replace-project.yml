name: Replace Project From ZIP

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  replace-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/project
          mkdir -p /tmp/project

          echo "Extracting $ZIP_FILE ..."

          unzip -q -o "$ZIP_FILE" -d /tmp/project

          echo "Extraction completed."

          echo "Extracted structure:"
          find /tmp/project -maxdepth 3 -type f | head -100

      - name: Detect project root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          # ZIP contains the repository directly
          if [ -f "/tmp/project/package.json" ]; then
            PROJECT_ROOT="/tmp/project"
          fi

          # ZIP contains one enclosing project folder
          if [ -z "$PROJECT_ROOT" ]; then
            FOUND=$(find /tmp/project \
              -mindepth 2 \
              -maxdepth 3 \
              -type f \
              -name "package.json" \
              | head -n 1 || true)

            if [ -n "$FOUND" ]; then
              PROJECT_ROOT="$(dirname "$FOUND")"
            fi
          fi

          # Prefer a root that contains the complete application
          for DIR in $(find /tmp/project -type d -name "apps" 2>/dev/null); do
            CANDIDATE="$(dirname "$DIR")"

            if [ -f "$CANDIDATE/package.json" ] && \
               [ -d "$CANDIDATE/apps/business-admin" ]; then
              PROJECT_ROOT="$CANDIDATE"
              break
            fi
          done

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Could not determine project root."
            find /tmp/project -maxdepth 4 -print
            exit 1
          fi

          echo "Project root detected:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Validate extracted project
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating project..."

          test -f "$PROJECT_ROOT/package.json"

          if [ ! -d "$PROJECT_ROOT/apps/business-admin" ]; then
            echo "WARNING: apps/business-admin was not found."
            echo "Continuing because the ZIP may use a different project layout."
          fi

          echo "Project validation passed."

      - name: Prepare new project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/final-project
          mkdir -p /tmp/final-project

          cp -a "$PROJECT_ROOT"/. /tmp/final-project/

          echo "New project prepared."

      - name: Remove old project
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing old repository files..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          echo "Old project removed."

      - name: Install new project
        shell: bash
        run: |
          set -euo pipefail

          cp -a /tmp/final-project/. .

          echo "New project installed."

      - name: Delete all ZIP files
        shell: bash
        run: |
          set -euo pipefail

          echo "Deleting all ZIP files..."

          find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            -delete

          echo "All ZIP files deleted."

      - name: Verify replacement
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking final repository..."

          test -f package.json

          if [ -d "apps/business-admin" ]; then
            test -f apps/business-admin/package.json
            echo "Business Admin detected."
          fi

          if find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            | grep -q .; then
            echo "ERROR: ZIP files still exist."
            exit 1
          fi

          echo ""
          echo "===================================="
          echo "PROJECT REPLACEMENT SUCCESSFUL"
          echo "===================================="

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Replace project from uploaded ZIP"
          git push
