name: Replace Project From ZIP

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "**/*.zip"

permissions:
  contents: write

# Prevent two replacement runs from modifying main simultaneously.
concurrency:
  group: replace-project-main
  cancel-in-progress: true

jobs:
  replace-project:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout the current main branch
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # ---------------------------------------------------------
      # 2. Find the newest ZIP
      # ---------------------------------------------------------
      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(
            find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              -printf "%T@ %p\n" \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 3. Extract ZIP into temporary directory
      # ---------------------------------------------------------
      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/project-extracted
          mkdir -p /tmp/project-extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q -o "$ZIP_FILE" -d /tmp/project-extracted

          echo "Extraction successful."

          echo "Top-level extracted contents:"
          find /tmp/project-extracted \
            -maxdepth 2 \
            -print \
            | sort \
            | head -200

      # ---------------------------------------------------------
      # 4. Detect the complete project root
      # ---------------------------------------------------------
      - name: Detect project root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          # Case 1:
          # ZIP contains the repository directly.
          if [ -f "/tmp/project-extracted/package.json" ]; then
            PROJECT_ROOT="/tmp/project-extracted"
          fi

          # Case 2:
          # ZIP contains one enclosing project directory.
          if [ -z "$PROJECT_ROOT" ]; then
            for DIR in /tmp/project-extracted/*; do
              if [ -d "$DIR" ] && \
                 [ -f "$DIR/package.json" ]; then

                PROJECT_ROOT="$DIR"
                break
              fi
            done
          fi

          # Case 3:
          # Locate the monorepo by apps/business-admin.
          if [ -z "$PROJECT_ROOT" ]; then
            BUSINESS_PACKAGE="$(
              find /tmp/project-extracted \
                -type f \
                -path "*/apps/business-admin/package.json" \
                | head -n 1
            )"

            if [ -n "$BUSINESS_PACKAGE" ]; then
              PROJECT_ROOT="$(dirname "$(dirname "$(dirname "$BUSINESS_PACKAGE")")")"
            fi
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Complete project root could not be detected."

            echo ""
            echo "Extracted files:"
            find /tmp/project-extracted \
              -maxdepth 5 \
              -print \
              | sort

            exit 1
          fi

          echo ""
          echo "================================"
          echo "PROJECT ROOT"
          echo "================================"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 5. Validate BEFORE deleting the existing project
      # ---------------------------------------------------------
      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating new project..."

          if [ ! -f "$PROJECT_ROOT/package.json" ]; then
            echo "ERROR: package.json missing."
            exit 1
          fi

          if [ -d "$PROJECT_ROOT/apps/business-admin" ]; then
            echo "Business Admin detected."

            test -f "$PROJECT_ROOT/apps/business-admin/package.json"

            if [ -f "$PROJECT_ROOT/apps/business-admin/next.config.ts" ]; then
              echo "Next.js configuration detected."
            fi

            if [ -f "$PROJECT_ROOT/apps/business-admin/proxy.ts" ]; then
              echo "Next.js proxy.ts detected."
            fi
          fi

          echo ""
          echo "Project validation passed."

      # ---------------------------------------------------------
      # 6. Prepare a clean temporary copy
      # ---------------------------------------------------------
      - name: Prepare new project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/project-ready
          mkdir -p /tmp/project-ready

          cp -a "$PROJECT_ROOT"/. /tmp/project-ready/

          echo "New project prepared."

      # ---------------------------------------------------------
      # 7. Remove old application
      #
      # .git is preserved.
      # .github is preserved so this workflow survives.
      # ---------------------------------------------------------
      - name: Remove old application
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing old application files..."

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          echo "Old application removed."

      # ---------------------------------------------------------
      # 8. Install the complete new application
      # ---------------------------------------------------------
      - name: Install new application
        shell: bash
        run: |
          set -euo pipefail

          cp -a /tmp/project-ready/. .

          echo "New application installed."

      # ---------------------------------------------------------
      # 9. Delete ALL ZIP files
      # ---------------------------------------------------------
      - name: Delete all ZIP files
        shell: bash
        run: |
          set -euo pipefail

          echo "Deleting all ZIP files..."

          find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            -delete

          echo "ZIP cleanup complete."

      # ---------------------------------------------------------
      # 10. Final verification
      # ---------------------------------------------------------
      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking final repository..."

          test -f package.json

          if [ -d "apps/business-admin" ]; then
            test -f "apps/business-admin/package.json"
            echo "apps/business-admin verified."
          fi

          if find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            | grep -q .; then

            echo "ERROR: ZIP files still remain."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "PROJECT REPLACEMENT VERIFIED"
          echo "========================================"

      # ---------------------------------------------------------
      # 11. Commit
      # ---------------------------------------------------------
      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Replace project from uploaded ZIP"

      # ---------------------------------------------------------
      # 12. Synchronize with remote main before pushing
      #
      # This fixes the exact non-fast-forward failure from run #91.
      # ---------------------------------------------------------
      - name: Synchronize with latest main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          git rebase origin/main

      # ---------------------------------------------------------
      # 13. Push the completed replacement
      # ---------------------------------------------------------
      - name: Push replacement
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main

          echo ""
          echo "========================================"
          echo "PROJECT SUCCESSFULLY PUSHED TO MAIN"
          echo "========================================"
