name: Replace Project From ZIP

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "**/*.zip"

permissions:
  contents: write

concurrency:
  group: replace-project-main
  cancel-in-progress: true

jobs:
  replace-project:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # =========================================================
      # 2. Determine WHY this workflow was triggered
      #
      # A ZIP must have been ADDED or MODIFIED.
      #
      # If the ZIP was DELETED, this run does nothing.
      # =========================================================
      - name: Check ZIP change
        id: zip_change
        shell: bash
        run: |
          set -euo pipefail

          # Manual workflow execution:
          # allow it to look for an existing ZIP.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow execution."

            ZIP_FILE="$(
              find . \
                -type f \
                -iname "*.zip" \
                -not -path "./.git/*" \
                -printf "%T@ %p\n" \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2- || true
            )"

            if [ -z "$ZIP_FILE" ]; then
              echo "No ZIP exists."
              echo "Nothing to process."

              echo "should_process=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Manual run found ZIP:"
            echo "$ZIP_FILE"

            echo "should_process=true" >> "$GITHUB_OUTPUT"
            echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          # -----------------------------------------------------
          # Automatic push-triggered workflow
          # -----------------------------------------------------

          echo "Checking files changed by commit:"
          echo "$GITHUB_SHA"

          ZIP_CHANGE="$(
            git diff-tree \
              --no-commit-id \
              --name-status \
              --diff-filter=AMR \
              -r \
              "$GITHUB_SHA" \
            | grep -Ei '\.zip$' \
            | head -n 1 \
            || true
          )"

          if [ -z "$ZIP_CHANGE" ]; then
            echo ""
            echo "No ZIP was added or modified."
            echo "This was probably a ZIP deletion."
            echo "Nothing to process."

            echo "should_process=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo ""
          echo "ZIP addition/modification detected:"
          echo "$ZIP_CHANGE"

          ZIP_FILE="$(
            find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              -printf "%T@ %p\n" \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2- \
            || true
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP was reported as added/modified but cannot be found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          echo "should_process=true" >> "$GITHUB_OUTPUT"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 3. Validate ZIP
      # =========================================================
      - name: Validate ZIP
        if: steps.zip_change.outputs.should_process == 'true'
        shell: bash
        env:
          ZIP_FILE: ${{ steps.zip_change.outputs.ZIP_FILE }}
        run: |
          set -euo pipefail

          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo "ZIP integrity check passed."

      # =========================================================
      # 4. Extract ZIP
      # =========================================================
      - name: Extract ZIP
        if: steps.zip_change.outputs.should_process == 'true'
        shell: bash
        env:
          ZIP_FILE: ${{ steps.zip_change.outputs.ZIP_FILE }}
        run: |
          set -euo pipefail

          rm -rf /tmp/project-extracted
          mkdir -p /tmp/project-extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q -o "$ZIP_FILE" -d /tmp/project-extracted

          echo ""
          echo "Extraction successful."

          echo ""
          echo "Extracted contents:"
          find /tmp/project-extracted \
            -maxdepth 5 \
            -print \
            | sort \
            | head -300

      # =========================================================
      # 5. Detect project root
      # =========================================================
      - name: Detect project root
        if: steps.zip_change.outputs.should_process == 'true'
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          # -----------------------------------------------------
          # Direct project
          # -----------------------------------------------------
          if [ -f "/tmp/project-extracted/package.json" ]; then
            ROOT="/tmp/project-extracted"
          fi

          # -----------------------------------------------------
          # One enclosing directory
          # -----------------------------------------------------
          if [ -z "$ROOT" ]; then
            FOUND="$(
              find /tmp/project-extracted \
                -mindepth 2 \
                -maxdepth 2 \
                -type f \
                -name "package.json" \
                | head -n 1 \
                || true
            )"

            if [ -n "$FOUND" ]; then
              ROOT="$(dirname "$FOUND")"
            fi
          fi

          # -----------------------------------------------------
          # Deeper project
          # -----------------------------------------------------
          if [ -z "$ROOT" ]; then
            FOUND="$(
              find /tmp/project-extracted \
                -type f \
                -name "package.json" \
                | head -n 1 \
                || true
            )"

            if [ -n "$FOUND" ]; then
              ROOT="$(dirname "$FOUND")"
            fi
          fi

          # -----------------------------------------------------
          # Current Amaal monorepo
          # -----------------------------------------------------
          BUSINESS_PACKAGE="$(
            find /tmp/project-extracted \
              -type f \
              -path "*/apps/business-admin/package.json" \
              | head -n 1 \
              || true
          )"

          if [ -n "$BUSINESS_PACKAGE" ]; then
            BUSINESS_ROOT="$(dirname "$BUSINESS_PACKAGE")"
            MONOREPO_ROOT="$(dirname "$(dirname "$BUSINESS_ROOT")")"

            if [ -f "$MONOREPO_ROOT/package.json" ]; then
              ROOT="$MONOREPO_ROOT"
            fi
          fi

          # -----------------------------------------------------
          # Verify
          # -----------------------------------------------------
          if [ -z "$ROOT" ]; then
            echo "ERROR: Could not determine project root."

            find /tmp/project-extracted \
              -maxdepth 6 \
              -print \
              | sort

            exit 1
          fi

          if [ ! -f "$ROOT/package.json" ]; then
            echo "ERROR: package.json not found at:"
            echo "$ROOT"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "PROJECT ROOT"
          echo "=========================================="
          echo "$ROOT"

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 6. Validate BEFORE touching old project
      # =========================================================
      - name: Validate new project
        if: steps.zip_change.outputs.should_process == 'true'
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -euo pipefail

          echo "Validating new project..."

          test -f "$PROJECT_ROOT/package.json"

          echo "package.json: OK"

          if [ -d "$PROJECT_ROOT/apps/business-admin" ]; then
            echo "apps/business-admin detected."

            if [ -f "$PROJECT_ROOT/apps/business-admin/package.json" ]; then
              echo "business-admin/package.json: OK"
            fi
          fi

          echo ""
          echo "New project validation passed."

      # =========================================================
      # 7. Stage new project
      # =========================================================
      - name: Stage new project
        if: steps.zip_change.outputs.should_process == 'true'
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -euo pipefail

          rm -rf /tmp/project-ready
          mkdir -p /tmp/project-ready

          cp -a "$PROJECT_ROOT"/. /tmp/project-ready/

          echo "New project staged successfully."

      # =========================================================
      # 8. Remove old application
      #
      # NEVER remove .git or .github.
      # =========================================================
      - name: Remove old application
        if: steps.zip_change.outputs.should_process == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing old application..."

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          echo "Old application removed."

      # =========================================================
      # 9. Install new application
      # =========================================================
      - name: Install new application
        if: steps.zip_change.outputs.should_process == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cp -a /tmp/project-ready/. .

          echo "New application installed."

      # =========================================================
      # 10. Delete ALL ZIP files
      # =========================================================
      - name: Delete all ZIP files
        if: steps.zip_change.outputs.should_process == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Deleting all ZIP files..."

          find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            -delete

          echo "All ZIP files deleted."

      # =========================================================
      # 11. Final verification
      # =========================================================
      - name: Final verification
        if: steps.zip_change.outputs.should_process == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying final project..."

          test -f package.json

          if [ -d "apps/business-admin" ]; then
            test -f "apps/business-admin/package.json"
            echo "Business Admin verified."
          fi

          REMAINING_ZIP="$(
            find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              | head -n 1 \
              || true
          )"

          if [ -n "$REMAINING_ZIP" ]; then
            echo "ERROR: ZIP still exists:"
            echo "$REMAINING_ZIP"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "PROJECT REPLACEMENT VERIFIED"
          echo "=========================================="

      # =========================================================
      # 12. Commit
      # =========================================================
      - name: Commit replacement
        if: steps.zip_change.outputs.should_process == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Replace project from uploaded ZIP"

      # =========================================================
      # 13. Synchronize with latest main
      # =========================================================
      - name: Synchronize with latest main
        if: steps.zip_change.outputs.should_process == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          git rebase origin/main

      # =========================================================
      # 14. Push
      # =========================================================
      - name: Push replacement
        if: steps.zip_change.outputs.should_process == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main

          echo ""
          echo "=========================================="
          echo "PROJECT SUCCESSFULLY PUSHED TO MAIN"
          echo "=========================================="
